<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rechenfuchs">
<meta name="theme-color" content="#FFF7EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17132A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Rechenfuchs – 9 Mathe-Spiele für die 2. Klasse. Rechnen bis 100 ohne Finger.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Rechenfuchs</title>
<style>
:root{
  --bg:#FFF7EC; --bg2:#FFEEDA; --card:#FFFFFF; --ink:#2B2140; --muted:#7A6F8A; --line:#EADCC8;
  --fox:#FF7A1A; --fox2:#FFB347; --ok:#1FAF6A; --bad:#EF476F; --lie:#8B5CF6;
  --shadow:0 5px 0 rgba(43,33,64,.07), 0 10px 22px rgba(43,33,64,.07);
  --ga:#FF7A1A;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17132A; --bg2:#1F1938; --card:#272044; --ink:#F6F1FF; --muted:#A99FC2; --line:#3A3262;
    --shadow:0 5px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.28); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{opacity:.35;cursor:default}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

/* ---------- Shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(var(--st) + 10px) max(16px,var(--sr)) 10px max(16px,var(--sl));
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .bf{font-size:26px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:800;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
#view{flex:1;width:100%;max-width:980px;margin:0 auto;padding:4px max(16px,var(--sr)) calc(100px + var(--sb)) max(16px,var(--sl))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;gap:6px;
  padding:8px 12px calc(8px + var(--sb));background:color-mix(in srgb,var(--card) 90%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px;border-radius:14px;font-size:12px;font-weight:800;color:var(--muted)}
.tab .ti{font-size:25px;filter:grayscale(.7);opacity:.7;transition:transform .2s}
.tab[aria-current="true"]{color:var(--fox)}
.tab[aria-current="true"] .ti{filter:none;opacity:1;transform:scale(1.12)}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.sec{font-size:15px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}
.small{font-size:13px;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:18px;
  background:var(--ga);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 color-mix(in srgb,var(--ga) 62%,#000);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.btn.big{min-height:62px;font-size:21px;width:100%;max-width:420px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.danger{--ga:#D9364F}
.btn.sm{min-height:42px;font-size:16px;padding:8px 14px;border-radius:14px}

/* ---------- Home ---------- */
.install{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--fox) 14%,var(--card));border:2px solid color-mix(in srgb,var(--fox) 35%,transparent);
  border-radius:20px;padding:12px 14px;margin:6px 0 12px;font-size:15px;font-weight:600;line-height:1.4}
.install .ii{font-size:26px}
.install b{font-weight:800}
.install svg{width:17px;height:17px;vertical-align:-3px;color:#2F7BF6}
.install .ix{margin-left:auto;font-size:18px;font-weight:800;color:var(--muted);width:32px;height:32px;flex:none}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hero .av{width:64px;height:64px;flex:none;border-radius:22px;background:var(--card);display:grid;place-items:center;font-size:40px;box-shadow:var(--shadow)}
.hello{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hello-sub{font-size:16px;color:var(--muted);font-weight:600;margin-top:3px}
.goal .gr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.bar{height:14px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--fox2),var(--fox));transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gcard{position:relative;overflow:hidden;min-height:156px;border-radius:24px;padding:14px;color:#fff;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c) 70%);
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 62%,#000);transition:transform .1s}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 62%,#000)}
.gcard .ge{font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.gcard .gt{font-size:18px;font-weight:800;line-height:1.15}
.gcard .gs{font-size:13px;font-weight:600;opacity:.92;line-height:1.25;margin-top:2px}
.gcard .gn{position:absolute;right:-6px;bottom:-26px;font-size:110px;font-weight:900;opacity:.14;line-height:1}
.gcard .glv{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.26);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800}

/* ---------- Stickers ---------- */
.shead{text-align:center;padding:10px 0 4px}
.shead .big{font-size:46px;font-weight:900;letter-spacing:-.02em}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px;margin-top:16px}
.stk{aspect-ratio:1;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:44px}
.stk.lock{background:var(--bg2);box-shadow:none;font-size:22px;color:var(--muted);font-weight:800;border:2px dashed var(--line)}

/* ---------- Eltern ---------- */
.el h3{font-size:18px;font-weight:800;margin-bottom:10px}
.el .card{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-weight:700;font-size:14px;color:var(--muted)}
.field input{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;outline:none}
.field input:focus{border-color:var(--fox)}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{width:48px;height:48px;border-radius:14px;background:var(--bg);font-size:28px;border:2px solid transparent}
.avs button.on{border-color:var(--fox);background:color-mix(in srgb,var(--fox) 14%,var(--card))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .rl{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.row .rl span:first-child{font-size:24px}
.chips{display:flex;gap:6px;flex:none}
.chips button{min-width:40px;height:36px;border-radius:11px;background:var(--bg);font-weight:800;border:2px solid var(--line)}
.chips button.on{background:var(--fox);color:#fff;border-color:var(--fox)}
.stat{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:12px;font-weight:700;color:var(--muted)}
.week i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--fox);min-height:3px}
.week b{color:var(--ink);font-size:12px}
.mist{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.mist:first-child{border-top:0}
.mist .mt{font-weight:800;font-variant-numeric:tabular-nums}
.mist .mg{color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.gate{text-align:center;padding:30px 10px}
.gate .gi{font-size:56px}
.gate input{text-align:center;max-width:160px;margin:14px auto}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.switch{width:56px;height:34px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(22px)}

/* ---------- Game layer ---------- */
#game{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:var(--st) var(--sr) var(--sb) var(--sl);overflow:hidden}
#game::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--ga) 20%,transparent),transparent 70%)}
.g-head{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.g-x{width:46px;height:46px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:900;flex:none}
.g-title{flex:1;text-align:center;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-stars{flex:none;min-width:46px}
.g-stars.bump{animation:bump .45s}
.dots{position:relative;display:flex;justify-content:center;gap:7px;padding:6px 0 4px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--ga);transform:scale(1.25)}
.dots i.p{background:var(--ok)}
.dots i.o{background:var(--fox2)}
.dots i.x{background:var(--bad)}
.g-body{position:relative;flex:1;min-height:0;width:100%;max-width:580px;margin:0 auto;padding:0 16px 12px;display:flex;flex-direction:column}
.task{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:6px 0}
.inp{flex:none}

.say{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.say .fx{font-size:46px;line-height:1;flex:none;animation:bob 2.6s ease-in-out infinite}
.say .bub{background:var(--card);border-radius:22px 22px 22px 6px;padding:12px 16px;font-size:clamp(17px,4.6vw,21px);font-weight:650;line-height:1.38;box-shadow:var(--shadow);text-align:left}
.say .bub b{color:var(--ga);font-weight:900}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-size:clamp(36px,11vw,58px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eq .op{color:var(--muted);font-weight:800}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:1.8em;padding:2px 12px;border-radius:18px;background:var(--card);
  border:3px dashed color-mix(in srgb,var(--ga) 65%,transparent);color:var(--ga);font-variant-numeric:tabular-nums;line-height:1.2}
.slot.filled{border-style:solid}
.slot.ok{border:3px solid var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));animation:pop .4s}
.slot.bad{border-color:var(--bad);color:var(--bad);animation:shake .42s}
.slot.reveal{border:3px solid var(--fox2);color:var(--ink);background:color-mix(in srgb,var(--fox2) 25%,var(--card))}
.slot.nudge{animation:shake .3s}

.hint{display:flex;gap:10px;align-items:flex-start;max-width:440px;margin:0 auto 10px;padding:10px 14px;border-radius:18px;
  background:color-mix(in srgb,var(--fox2) 24%,var(--card));font-size:16px;font-weight:650;line-height:1.4;text-align:left;animation:rise .3s}
.hint.sol{background:color-mix(in srgb,var(--ga) 16%,var(--card))}
.hint .hi{font-size:22px;line-height:1}
.hint b{font-weight:900}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.pad button{height:clamp(50px,8.4vh,76px);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--line);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;transition:transform .06s}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.pad .ok{background:var(--ga);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.pad .ok:active{box-shadow:0 1px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.pad .del{font-size:24px;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.choices button{height:clamp(50px,7.6vh,68px);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--line);font-size:28px;font-weight:800;position:relative}
.choices button::after{content:"♥";position:absolute;top:3px;right:8px;font-size:12px;color:var(--ga);opacity:.55}
.choices button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.next{display:flex;justify-content:center;padding-top:6px}
.praise{position:absolute;left:50%;top:calc(var(--st) + 70px);transform:translateX(-50%);z-index:3;pointer-events:none;
  font-size:30px;font-weight:900;color:var(--ok);white-space:nowrap;opacity:0;text-shadow:0 2px 0 var(--card)}
.praise.show{animation:praise 1.1s ease-out}

/* visual helpers */
.tf{display:grid;grid-template-columns:repeat(5,22px);gap:5px;padding:8px;border-radius:12px;background:var(--card);margin-top:8px;width:max-content}
.tf i{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);opacity:.5}
.tf i.on{background:var(--ga);border-color:var(--ga);opacity:1}
.dr{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.dr i{width:18px;height:18px;border-radius:50%;background:var(--ga)}
.dr.b i{background:var(--lie)}
.nl{width:100%;max-width:320px;height:auto;margin-top:6px;display:block}
.hausnr{display:inline-flex;flex-direction:column;align-items:center}
.hausnr .hh{font-size:64px;line-height:1}
.hausnr .hs{margin-top:-6px;background:#1D4FA3;color:#fff;border:4px solid #fff;outline:3px solid #1D4FA3;border-radius:12px;padding:2px 18px;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border:3px solid #111;border-radius:10px;overflow:hidden;font-family:"DIN Alternate","Arial Narrow",var(--font);box-shadow:var(--shadow)}
.plate .eu{background:#1D4FA3;color:#FFD400;width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;font-size:15px;font-weight:800}
.plate .eu::before{content:"★";font-size:12px;margin-bottom:auto;margin-top:5px}
.plate .pt{padding:6px 16px;font-size:40px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.chain .cb{min-width:62px;height:62px;padding:0 8px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.chain .cb.first{opacity:.55}
.chain .ca{font-size:15px;font-weight:900;color:var(--ga);display:flex;flex-direction:column;align-items:center;line-height:1}
.chain .slot{font-size:28px;min-width:72px;height:62px;border-radius:31px}
.machine{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(30px,9vw,46px);font-weight:900;flex-wrap:wrap}
.machine .mop{background:var(--ga);color:#fff;border-radius:16px;padding:4px 14px;box-shadow:0 4px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.machine .arr{color:var(--muted);font-size:.7em}
.tafel{background:#2E5E4E;color:#F4F1E6;border:8px solid #9A6B3F;border-radius:14px;padding:18px 22px;font-size:clamp(34px,10vw,52px);font-weight:800;
  font-variant-numeric:tabular-nums;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.tafel .shown{transition:all .3s}
.tafel .shown.strike{text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:var(--bad);opacity:.7}
.tafel .shown.good{color:#7CF2B3}
.tafel .slot{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.6)}
.tafel .slot.ok{color:#7CF2B3;border-color:#7CF2B3;background:rgba(124,242,179,.15)}
.bin{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;margin:0 auto;width:100%}
.bin button{min-height:96px;border-radius:22px;font-size:22px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bin button span{font-size:36px}
.bin .b-ok{background:var(--ok);box-shadow:0 6px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.bin .b-lie{background:var(--lie);box-shadow:0 6px 0 color-mix(in srgb,var(--lie) 60%,#000)}
.bin button:active{transform:translateY(5px);box-shadow:none}

/* intro / end */
.g-body.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.intro{align-items:center;text-align:center;gap:14px}
.ibig{font-size:84px;line-height:1;margin-top:6px;animation:bob 2.6s ease-in-out infinite}
.intro h1,.end h1{font-size:30px;font-weight:900;letter-spacing:-.02em}
.lvh{font-weight:800;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
.lvls button{background:var(--card);border-radius:18px;padding:10px 6px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.lvls button b{font-size:14px;letter-spacing:-2px}
.lvls button span{font-weight:900;font-size:15px}
.lvls button small{font-size:12px;color:var(--muted);font-weight:650;line-height:1.25}
.lvls button.on{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 12%,var(--card))}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:440px}
.modes button{background:var(--card);border-radius:16px;padding:12px 8px;font-weight:800;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.modes button.on{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 12%,var(--card))}
.tip{font-size:14px;color:var(--muted);font-weight:600;line-height:1.45;max-width:440px;background:var(--bg2);border-radius:16px;padding:10px 14px;text-align:left}
.end{align-items:center;justify-content:center;text-align:center;gap:14px}
.ebig{font-size:96px;line-height:1;animation:pop .6s}
.end p{font-size:18px;font-weight:650;color:var(--muted);max-width:380px;line-height:1.4}
.estars{font-size:34px;font-weight:900;color:var(--fox)}

<script>
'use strict';
/* =========================================================
   Rechenfuchs – Mathe-Spiele für die 2. Klasse
   Alle Daten bleiben lokal im Gerät (localStorage).
   ========================================================= */
const VERSION = '1.0.0';
const KEY = 'rechenfuchs.v1';
const SCHEMA = 1;
const STARS_PER_STICKER = 15;
const STICKERS = ['🐶','🐱','🐰','🦁','🐼','🐨','🐯','🦄','🐸','🐵','🐧','🐢','🦋','🐙','🦀','🐳','🦖','🦔','🦉','🐞','🚀','🌈','⚽','🎸','🏰','🍦','🎈','🧩','🛸','👑'];
const AVATARS = ['🐻','🐼','🐯','🦁','🐰','🐨','🐸','🦄','🐵','🐧','🐶','🐱'];
const SWEETS = ['🍬','🍭','🍫','🧁','🍩'];
const PRAISE = ['Super!','Klasse!','Genau!','Toll gemacht!','Richtig!','Stark!','Spitze!','Wow!','Prima!'];

const GAMES = [
  {id:'verliebt', n:1, sec:0, emoji:'💞', color:'#FF4F8B', title:'Verliebte Zahlen', sub:'Zusammen ergeben sie 10',
   how:'Ich sage eine Zahl – du findest ihren Partner. Zusammen ergeben die beiden genau <b>10</b> (oder 100)!',
   levels:['Partner bis 10','Zehner bis 100','Alle bis 100'],
   tip:'Die Zehnerpartner (3 + 7, 4 + 6 …) sind die wichtigste Grundlage für den Zehnerübergang. Sie sollten blitzschnell und ohne Finger sitzen.'},
  {id:'doppel', n:2, sec:0, emoji:'👯', color:'#3D82F5', title:'Verdoppeln', sub:'6 + 6 – und dann 6 + 7?',
   how:'Verdopple die Zahl! Wer <b>6 + 6</b> weiß, kann <b>6 + 7</b> ganz leicht herleiten.',
   levels:['Doppelte bis 20','Fast-Doppelte','Große Zahlen'],
   tip:'Verdoppeln ist ein Rechentrick, kein Auswendiglernen: Aus 7 + 7 = 14 wird 7 + 8 = 15. Fragen Sie ruhig nach: „Wie hast du das gerechnet?“'},
  {id:'ergaenzen', n:3, sec:0, emoji:'🏠', color:'#10A894', title:'Ergänzen bis 100', sub:'Hausnummern & Kennzeichen',
   how:'An einem Haus oder Auto steht eine Zahl. Wie viel fehlt bis 100? Erst bis zum nächsten Zehner, dann bis 100!',
   levels:['Bis zum Zehner','Zehner bis 100','Alle bis 100'],
   tip:'Unterwegs funktioniert das Spiel auch ohne Handy: Hausnummern, Kennzeichen, Preisschilder. Wichtig ist der Weg in zwei Sprüngen (47 → 50 → 100).'},
  {id:'neuner', n:4, sec:1, emoji:'⛓️', color:'#F29A00', title:'Neuner-Kette', sub:'Immer plus 9',
   how:'Die Kette wächst immer um 9. Der Trick: erst <b>plus 10</b>, dann <b>minus 1</b>!',
   levels:['Bis 60','Bis 100','Profi-Ketten'],
   tip:'„Plus 10, minus 1“ ist ein Ausgleichs-Trick. In Stufe 3 kommen +11 (plus 10, plus 1) und +19 (plus 20, minus 1) dazu.'},
  {id:'raetsel', n:5, sec:1, emoji:'🔮', color:'#8B5CF6', title:'Zahlenrätsel', sub:'Welche Zahl denke ich?',
   how:'Ich denke an eine Zahl und rechne etwas dazu. Findest du heraus, welche Zahl es war? Danach darfst du <b>mir</b> ein Rätsel stellen!',
   levels:['Bis 20','Mit Zehnern','Alle bis 100'],
   tip:'Rückwärtsrechnen (Umkehraufgabe) ist anspruchsvoll. Wenn Ihr Kind dem Fuchs ein Rätsel stellt, muss es selbst richtig vorwärts rechnen – doppeltes Training.'},
  {id:'flunkern', n:6, sec:1, emoji:'🤥', color:'#EC3F6B', title:'Geflunkert!', sub:'Erwisch den Fuchs',
   how:'Ich rechne dir etwas vor – aber manchmal <b>flunkere</b> ich! Stimmt es, oder hab ich geflunkert?',
   levels:['Bis 20','Plus Zehner','Alle bis 100'],
   tip:'Kinder lieben es, Erwachsene bei Fehlern zu erwischen. Wer einen Flunker entlarvt, darf danach die richtige Lösung nennen – und bekommt einen Extra-Stern.'},
  {id:'karten', n:7, sec:2, emoji:'🃏', color:'#16A36A', title:'Karten bis 100', sub:'Wer ist zuerst bei 100?', board:true,
   how:'Deckt abwechselnd eine Karte auf und zählt sie zu eurer Summe dazu. Wer zuerst bei <b>100</b> ist, gewinnt!',
   levels:['Ziel 50','Ziel 100','Große Karten'],
   tip:'Spielen Sie „Zu zweit“ gemeinsam am iPad. Mit echten Uno- oder Zahlenkarten klappt das Spiel natürlich auch am Tisch.'},
  {id:'rueckwaerts', n:8, sec:2, emoji:'🎲', color:'#5560EE', title:'Rückwärts bis 50', sub:'Würfeln und abziehen', board:true,
   how:'Ihr startet beide bei 100. Würfelt abwechselnd und zieht die Augenzahl ab. Wer zuerst bei <b>50</b> ist, gewinnt!',
   levels:['Von 30 bis 10','Von 100 bis 50','Zwei Würfel'],
   tip:'Minus über den Zehner (52 − 4) ist für viele Kinder die schwierigste Stelle. Der Tipp: erst bis zum Zehner (52 − 2 = 50), dann den Rest.'},
  {id:'kuerbis', n:9, sec:2, emoji:'🎃', color:'#FF7314', title:'Süßes oder Rechnen', sub:'Halloween auf dem Kürbisfeld', board:true,
   how:'Würfle über das Kürbisfeld. Auf einem 🎃 ziehst du eine Rechenkarte. Richtig gerechnet = eine Süßigkeit! Wer zuerst alle <b>5</b> hat, gewinnt.',
   levels:['Plus bis 20','Plus bis 100','Schriftlich'],
   tip:'Auf der 🦇 darf man nochmal würfeln. Stufe 3 zeigt die Aufgaben untereinander wie beim schriftlichen Rechnen.'}
];
const GAME = Object.fromEntries(GAMES.map(g => [g.id, g]));
const SECTIONS = ['Kopfrechen-Basics', 'Im Auto oder Wartezimmer', 'Zuhause am Tisch'];

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
const kidName = () => state.profile.name || 'Du';

/* ---------- state ---------- */
function defaultGame(){ return {level:1, rounds:0, correct:0, wrong:0, best:0, wins:0, last:null}; }
function defaults(){
  const games = {}; GAMES.forEach(g => games[g.id] = defaultGame());
  return {schema:SCHEMA, created:Date.now(), profile:{name:'', avatar:'🐻', onboarded:false},
    settings:{sound:true, dailyGoal:20}, games, stars:0, stickers:[], mistakes:[], days:{}, goalDays:[]};
}
function normalize(raw){
  const d = defaults();
  if(!raw || typeof raw !== 'object') return d;
  const s = raw;
  // Migrationen künftiger Schema-Versionen hier ergänzen: if((s.schema||0) < 2) { ... }
  const out = Object.assign({}, d, s);
  out.schema = SCHEMA;
  out.profile = Object.assign({}, d.profile, s.profile || {});
  out.profile.name = String(out.profile.name || '').slice(0, 20);
  if(!AVATARS.includes(out.profile.avatar)) out.profile.avatar = '🐻';
  out.settings = Object.assign({}, d.settings, s.settings || {});
  out.settings.sound = out.settings.sound !== false;
  out.settings.dailyGoal = [10, 20, 30, 40].includes(+out.settings.dailyGoal) ? +out.settings.dailyGoal : 20;
  out.games = {};
  GAMES.forEach(g => {
    const m = Object.assign(defaultGame(), (s.games || {})[g.id] || {});
    m.level = Math.min(3, Math.max(1, parseInt(m.level, 10) || 1));
    ['rounds','correct','wrong','best','wins'].forEach(k => m[k] = Math.max(0, parseInt(m[k], 10) || 0));
    out.games[g.id] = m;
  });
  out.stars = Math.max(0, parseInt(s.stars, 10) || 0);
  out.stickers = Array.isArray(s.stickers) ? s.stickers.filter(x => STICKERS.includes(x)) : [];
  const should = Math.min(STICKERS.length, Math.floor(out.stars / STARS_PER_STICKER));
  for(const st of STICKERS){ if(out.stickers.length >= should) break; if(!out.stickers.includes(st)) out.stickers.push(st); }
  out.mistakes = Array.isArray(s.mistakes) ? s.mistakes.slice(0, 40) : [];
  out.days = (s.days && typeof s.days === 'object' && !Array.isArray(s.days)) ? Object.assign({}, s.days) : {};
  const keys = Object.keys(out.days).sort();
  keys.slice(0, Math.max(0, keys.length - 120)).forEach(k => delete out.days[k]);
  out.goalDays = Array.isArray(s.goalDays) ? s.goalDays.slice(-120) : [];
  return out;
}
let state;
try { state = normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ state = defaults(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ toast('⚠️ Speichern nicht möglich'); } }
save();
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(p => { if(!p) navigator.storage.persist(); }).catch(() => {});
}

/* ---------- sound ---------- */
let actx = null;
function tone(freqs, dur = .12, type = 'sine', gain = .14){
  if(!state.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .012);
      g.gain.exponentialRampToValueAtTime(.0008, t + dur * 1.7);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur * 1.8);
    });
  } catch(e){}
}
const sfx = {
  tap: () => tone([560], .035, 'sine', .05),
  ok: () => tone([660, 990], .1, 'sine', .14),
  bad: () => tone([310, 220], .13, 'triangle', .12),
  flip: () => tone([420, 640], .05, 'triangle', .07),
  step: () => tone([480 + Math.random() * 120], .04, 'square', .03),
  win: () => tone([523, 659, 784, 1047, 1319], .12, 'sine', .14),
  sticker: () => tone([784, 988, 1175, 1568], .09, 'triangle', .1)
};

/* ---------- UI primitives ---------- */
const view = $('#view'), layer = $('#game');
let tab = 'home', parentOK = false, keyHandler = null, cur = null;
const ABORT = {abort:true};

function toast(txt, ms = 2400){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = txt;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function confetti(n = 60){
  const box = document.createElement('div'); box.className = 'confetti';
  const items = ['⭐','🎉','✨','🟠','🟣','🟢','🔵','🦊'];
  for(let i = 0; i < n; i++){
    const e = document.createElement('i'); e.textContent = pick(items);
    e.style.left = Math.random() * 100 + 'vw'; e.style.fontSize = rnd(16, 32) + 'px';
    e.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; e.style.animationDelay = Math.random() * .5 + 's';
    box.appendChild(e);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3800);
}
function modal(html){
  const bg = document.createElement('div'); bg.className = 'mbg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  return {el: bg, close: () => bg.remove()};
}
function confirmBox(title, text, yes = 'Ja', no = 'Abbrechen', danger = false){
  return new Promise(res => {
    const m = modal(`<h2>${title}</h2><p>${text}</p><div class="btnrow"><button class="btn ghost" data-n>${no}</button><button class="btn ${danger ? 'danger' : ''}" data-y>${yes}</button></div>`);
    m.el.onclick = e => {
      if(e.target.closest('[data-y]')){ m.close(); res(true); }
      else if(e.target.closest('[data-n]') || e.target === m.el){ m.close(); res(false); }
    };
  });
}

const padHtml = () => `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" class="del" aria-label="Löschen">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok" aria-label="Fertig">✓</button></div>`;

function numberLine(a, b, c, l1, l2){
  const x = v => 22 + (v - a) / (c - a) * 256;
  const xa = 22, xc = 278, xb = Math.max(70, Math.min(230, x(b)));
  const arc = (x1, x2, lab) => { const h = Math.max(30, (x2 - x1) * .5);
    return `<path d="M${x1} 58 Q ${(x1 + x2) / 2} ${58 - h} ${x2} 58" fill="none" stroke="var(--ga)" stroke-width="3.5" stroke-linecap="round"/>
    <text x="${(x1 + x2) / 2}" y="${58 - h / 2 - 7}" text-anchor="middle" font-size="16" font-weight="900" fill="var(--ga)">${lab}</text>`; };
  return `<svg class="nl" viewBox="0 0 300 92" role="img" aria-label="Zahlenstrahl">
    <line x1="12" y1="58" x2="288" y2="58" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
    ${arc(xa, xb, l1)}${arc(xb, xc, l2)}
    ${[[xa, a], [xb, b], [xc, c]].map(([xx, v]) => `<line x1="${xx}" y1="51" x2="${xx}" y2="65" stroke="var(--ink)" stroke-width="3"/><text x="${xx}" y="84" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">${v}</text>`).join('')}
  </svg>`;
}

/* Rechenhilfen */
function plusHelp(a, b){
  const s = a + b;
  if(b % 10 === 0) return {hint:`Nur die Zehner werden mehr: ${Math.floor(a / 10)} Zehner + ${b / 10} Zehner.`, explain:`${a} + ${b} = <b>${s}</b>`};
  if(b > 10){ const t = b - b % 10, o = b % 10;
    return {hint:`Erst die Zehner: ${a} + ${t} = ${a + t}. Dann noch + ${o}.`, explain:`${a} + ${t} = ${a + t}, dann ${a + t} + ${o} = <b>${s}</b>`}; }
  const toTen = (10 - a % 10) % 10;
  if(toTen > 0 && b > toTen) return {hint:`Erst bis zum Zehner: ${a} + ${toTen} = ${a + toTen}. Dann noch + ${b - toTen}.`,
    explain:`${a} + ${toTen} = ${a + toTen}, dann ${a + toTen} + ${b - toTen} = <b>${s}</b>`};
  if(a >= 10) return {hint:`Schau nur auf die Einer: ${a % 10} + ${b} = ${a % 10 + b}.`, explain:`${a} + ${b} = <b>${s}</b>`};
  return {hint:`Fang bei der größeren Zahl an und rechne im Kopf weiter.`, explain:`${a} + ${b} = <b>${s}</b>`};
}
function minusHelp(a, b){
  const d = a - b;
  if(b % 10 === 0) return {hint:`Nur die Zehner werden weniger: ${Math.floor(a / 10)} Zehner − ${b / 10} Zehner.`, explain:`${a} − ${b} = <b>${d}</b>`};
  if(b > 10){ const t = b - b % 10, o = b % 10;
    return {hint:`Erst die Zehner: ${a} − ${t} = ${a - t}. Dann noch − ${o}.`, explain:`${a} − ${t} = ${a - t}, dann ${a - t} − ${o} = <b>${d}</b>`}; }
  const ones = a % 10;
  if(ones > 0 && b > ones) return {hint:`Erst bis zum Zehner: ${a} − ${ones} = ${a - ones}. Dann noch − ${b - ones}.`,
    explain:`${a} − ${ones} = ${a - ones}, dann ${a - ones} − ${b - ones} = <b>${d}</b>`};
  if(ones === 0) return {hint:`Denk an die verliebten Zahlen: 10 − ${b} = ${10 - b}. Also ${a - 10} + ${10 - b}.`, explain:`${a} − ${b} = <b>${d}</b>`};
  return {hint:`Schau nur auf die Einer: ${ones} − ${b} = ${ones - b}.`, explain:`${a} − ${b} = <b>${d}</b>`};
}

/* ---------- Belohnungen & Statistik ---------- */
function record(gameId, ok, text, given, correct){
  const g = state.games[gameId];
  ok ? g.correct++ : g.wrong++;
  g.last = todayKey();
  const day = todayKey();
  state.days[day] = (state.days[day] || 0) + 1;
  let newSticker = null;
  if(ok){
    state.stars++;
    const should = Math.min(STICKERS.length, Math.floor(state.stars / STARS_PER_STICKER));
    if(state.stickers.length < should){
      newSticker = STICKERS.find(s => !state.stickers.includes(s));
      if(newSticker) state.stickers.push(newSticker);
    }
    if(cur){ cur.stars++; const b = layer.querySelector('.g-stars');
      if(b){ b.querySelector('b').textContent = cur.stars; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }
  } else {
    state.mistakes.unshift({g:gameId, t:String(text), a:given == null ? '–' : String(given), c:String(correct), d:Date.now()});
    state.mistakes = state.mistakes.slice(0, 40);
  }
  let goalNow = false;
  if(state.days[day] >= state.settings.dailyGoal && !state.goalDays.includes(day)){ state.goalDays.push(day); goalNow = true; }
  save(); updateStarPill();
  if(newSticker) setTimeout(() => stickerPopup(newSticker), 700);
  else if(goalNow) setTimeout(() => toast('🏆 Tagesziel geschafft! Super gemacht!', 3000), 600);
}
function stickerPopup(st){
  sfx.sticker(); confetti(50);
  const m = modal(`<div class="mbig">${st}</div><h2>Neuer Sticker!</h2><p>Du hast ${state.stars} Sterne gesammelt. Der Sticker klebt jetzt in deinem Album.</p><div class="btnrow"><button class="btn">Juhu! 🎉</button></div>`);
  m.el.onclick = e => { if(e.target.closest('button') || e.target === m.el) m.close(); };
}

async function exportData(){
  const json = JSON.stringify({app:'rechenfuchs', version:VERSION, exportedAt:new Date().toISOString(), data:state}, null, 2);
  const name = `rechenfuchs-backup-${todayKey()}.json`;
  let file = null;
  try { file = new File([json], name, {type:'application/json'}); } catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'Rechenfuchs Backup'}); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const data = obj && obj.app === 'rechenfuchs' ? obj.data : obj;
    if(!data || typeof data !== 'object' || !('games' in data)) throw new Error('kein Rechenfuchs-Backup');
    const n = normalize(data);
    if(!await confirmBox('Backup laden?', `${n.profile.name ? esc(n.profile.name) + ' · ' : ''}${n.stars} Sterne, ${n.stickers.length} Sticker. Der aktuelle Stand wird ersetzt.`, 'Laden', 'Abbrechen')) return;
    state = n; save(); toast('✅ Backup geladen'); renderView();
  } catch(err){ toast('⚠️ Datei konnte nicht gelesen werden'); }
});

  if(state.profile.onboarded) return;
  let av = state.profile.avatar;
  const m = modal(`<div class="mbig">🦊</div><h2>Hallo! Ich bin der Rechenfuchs.</h2><p>Wie heißt du? Und welche Spielfigur möchtest du sein?</p>

    <div class="avs" style="justify-content:center;margin-bottom:16px">${AVATARS.map(a => `<button data-oav="${a}" class="${a === av ? 'on' : ''}">${a}</button>`).join('')}</div>
    <div class="btnrow"><button class="btn" data-ob style="--ga:var(--fox)">Los geht's!</button></div>`);
  m.el.onclick = e => {
    const b = e.target.closest('[data-oav]');
    if(b){ av = b.dataset.oav; m.el.querySelectorAll('[data-oav]').forEach(x => x.classList.toggle('on', x === b)); sfx.tap(); return; }

      save(); m.close(); sfx.ok(); renderView();

/* =========================================================
   Spiel-Engine
   ========================================================= */
function newSession(id){
  if(cur) cur.alive = false;
  const s = {alive:true, id, stars:0, playing:false,
    async wait(ms){ await sleep(ms); if(!s.alive) throw ABORT; },
    check(){ if(!s.alive) throw ABORT; }};
  cur = s; return s;
}
function exitGame(){
  if(cur) cur.alive = false; cur = null; keyHandler = null;
  layer.hidden = true; layer.innerHTML = ''; document.body.style.overflow = '';
  renderView();
}
layer.addEventListener('click', async e => {
  if(!e.target.closest('[data-exit]')) return;
  sfx.tap();
  if(cur && cur.playing){
    const s = cur;
    if(!await confirmBox('Spiel beenden?', 'Deine Sterne aus diesem Spiel bleiben erhalten.', 'Beenden', 'Weiterspielen')) return;
    if(s !== cur) return;
  }
  exitGame();
});
document.addEventListener('keydown', e => {
  if(!keyHandler || e.target.tagName === 'INPUT') return;
  if(/^[0-9]$/.test(e.key)) keyHandler(e.key);
  else if(e.key === 'Backspace') keyHandler('del');
  else if(e.key === 'Enter') { e.preventDefault(); keyHandler('ok'); }
});

function frame(g, s, dots = false){

  layer.innerHTML = `<div class="g-head"><button class="g-x" data-exit aria-label="Beenden">✕</button>

function praise(txt){
  const p = layer.querySelector('.praise'); if(!p) return;
  p.textContent = txt || pick(PRAISE); p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
}
function bounce(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* Eingabe: Zahlenfeld oder Auswahl. Löst {ok, tries, first} auf. */
function answerFlow(mount, cfg){
  return new Promise(resolve => {
    let val = '', tries = 0, done = false, first = null;
    const slot = cfg.slot, choices = cfg.mode === 'choices';
    mount.innerHTML = `<div class="hint" hidden></div>` +
      (choices ? `<div class="choices">${cfg.choices.map(c => `<button data-v="${c}">${c}</button>`).join('')}</div>` : padHtml()) +
      `<div class="next" hidden><button class="btn big">Weiter ➜</button></div>`;
    const hintEl = mount.querySelector('.hint'), nextEl = mount.querySelector('.next'), inEl = mount.querySelector(choices ? '.choices' : '.pad');
    const show = () => { slot.textContent = val === '' ? '?' : val; slot.classList.toggle('filled', val !== ''); };
    show();
    function submit(){
      if(done) return;
      if(val === ''){ bounce(slot, 'nudge'); return; }
      const n = parseInt(val, 10);
      slot.classList.remove('bad', 'nudge');
      if(n === cfg.answer){
        done = true; keyHandler = null; slot.classList.add('ok'); sfx.ok(); praise();
        setTimeout(() => resolve({ok:true, tries:tries + 1, first}), 1000);
        return;
      }
      tries++; if(first === null) first = n; sfx.bad(); bounce(slot, 'bad');
      if(tries < 2){
        hintEl.innerHTML = `<span class="hi">💡</span><div>${cfg.hint}</div>`; hintEl.hidden = false;
        val = ''; setTimeout(() => { if(!done){ slot.classList.remove('bad'); show(); } }, 650);
      } else {
        done = true; keyHandler = null;
        hintEl.innerHTML = `<span class="hi">🦊</span><div>${cfg.explain}</div>`; hintEl.classList.add('sol'); hintEl.hidden = false;
        setTimeout(() => { slot.classList.remove('bad', 'filled'); slot.classList.add('reveal'); slot.textContent = cfg.answer; }, 500);
        inEl.hidden = true; nextEl.hidden = false;
        nextEl.querySelector('button').onclick = () => { sfx.tap(); resolve({ok:false, tries, first}); };
      }
    }
    const key = k => {
      if(done) return;
      if(k === 'del'){ val = val.slice(0, -1); sfx.tap(); show(); return; }
      if(k === 'ok'){ submit(); return; }
      if(val.length >= (cfg.maxLen || 3)) return;
      if(val === '0') val = '';
      val += k; sfx.tap(); show();
    };
    if(choices){
      inEl.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if(!b || done) return;
        val = b.dataset.v; show(); submit(); if(!done) b.disabled = true; });
      keyHandler = null;
    } else {
      inEl.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(b) key(b.dataset.k); });
      keyHandler = key;
    }
  });
}
async function ask(s, mount, cfg){ const r = await answerFlow(mount, cfg); s.check(); return r; }
function waitTap(s, el){
  return new Promise(res => {
    const h = () => { el.removeEventListener('click', h); keyHandler = null; res(); };
    el.addEventListener('click', h);
    keyHandler = k => { if(k === 'ok') h(); };
  }).then(() => s.check());
}

/* ---------- Aufgaben-Generatoren (Quiz-Spiele) ---------- */
const MAKERS = {
  verliebt(level){
    if(level === 1){
      const n = rnd(0, 10);
      return {prompt: say(`Ich sage <b>${n}</b>. Welche Zahl ist in die ${n} verliebt?`) +
        `<div class="eq">💞</div><div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>10</span></div>`,
        mode:'choices', choices:[...Array(11).keys()], answer:10 - n, text:`${n} + ? = 10`,
        hint:`Wie viele Plätze sind im Zehnerfeld noch frei?${tenFrame(n)}`,
        explain:`${n} + ${10 - n} = 10. Die beiden sind verliebt! 💞`};
    }
    if(level === 2){
      const n = rnd(1, 9) * 10;
      return {prompt: say(`Ich sage <b>${n}</b>. Wer ist in die ${n} verliebt? Zusammen sind sie <b>100</b>.`) +
        `<div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>100</span></div>`,
        answer:100 - n, text:`${n} + ? = 100`,
        hint:`Denk an die verliebten Zahlen bis 10: ${n / 10} + ${10 - n / 10} = 10. Mit Zehnern ist es genauso!`,
        explain:`${n / 10} + ${10 - n / 10} = 10, also ${n} + <b>${100 - n}</b> = 100.`};
    }
    let n; do { n = rnd(11, 89); } while(n % 10 === 0);
    const nt = Math.ceil(n / 10) * 10;
    return {prompt: say(`Ich sage <b>${n}</b>. Wer ist in die ${n} verliebt? Zusammen sind sie <b>100</b>.`) +
      `<div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>100</span></div>`,
      answer:100 - n, text:`${n} + ? = 100`,
      hint:`Erst bis zum nächsten Zehner: ${n} + ${nt - n} = ${nt}. Wie viel fehlt dann noch bis 100?`,
      explain:`${n} + ${nt - n} = ${nt}, dann ${nt} + ${100 - nt} = 100. Zusammen <b>${100 - n}</b>.${numberLine(n, nt, 100, '+' + (nt - n), '+' + (100 - nt))}`};
  },
  doppel(level){
    if(level === 1){
      const a = rnd(1, 10);
      return {prompt: say(`Verdopple die <b>${a}</b>!`) + `<div class="eq"><span>${a}</span><span class="op">+</span><span>${a}</span><span class="op">=</span><span class="slot">?</span></div>`,
        answer:2 * a, text:`${a} + ${a}`, hint:`Stell dir ${a} Punkte zweimal vor:${dotRow(a)}${dotRow(a, 'b')}`, explain:`${a} + ${a} = <b>${2 * a}</b>`};
    }
    if(level === 2){
      if(Math.random() < .25){ const a = rnd(6, 12);
        return {prompt: say(`Verdopple die <b>${a}</b>!`) + `<div class="eq"><span>${a}</span><span class="op">+</span><span>${a}</span><span class="op">=</span><span class="slot">?</span></div>`,
          answer:2 * a, text:`${a} + ${a}`, hint:`Verdopple erst die 10, dann den Rest.`, explain:`${a} + ${a} = <b>${2 * a}</b>`}; }
      const m = rnd(2, 9), up = Math.random() < .5, a = up ? m : m + 1, b = up ? m + 1 : m;
      return {prompt: say(`Fast verdoppelt! Rechne mit dem Trick.`) + `<div class="eq"><span>${a}</span><span class="op">+</span><span>${b}</span><span class="op">=</span><span class="slot">?</span></div>`,
        answer:a + b, text:`${a} + ${b}`, hint:`Verdopple zuerst: ${m} + ${m} = ${2 * m}. Und eins mehr?`,
        explain:`${m} + ${m} = ${2 * m}, und eins mehr ist <b>${a + b}</b>.`};
    }
    const a = pick([11,12,13,14,15,20,21,22,23,24,25,30,31,32,33,34,35,40,41,42,43,44,45]), near = Math.random() < .4;
    const T = a - a % 10, o = a % 10, b = near ? a + 1 : a;
    return {prompt: say(near ? `Fast verdoppelt – große Zahlen!` : `Verdopple die <b>${a}</b>!`) +
      `<div class="eq"><span>${a}</span><span class="op">+</span><span>${b}</span><span class="op">=</span><span class="slot">?</span></div>`,
      answer:a + b, text:`${a} + ${b}`,
      hint:`Verdopple Zehner und Einer einzeln: ${T} + ${T} = ${2 * T}${o ? `, ${o} + ${o} = ${2 * o}` : ''}.${near ? ' Dann noch eins mehr.' : ''}`,
      explain:`${T} + ${T} = ${2 * T}${o ? `, ${o} + ${o} = ${2 * o}` : ''}${near ? ', plus 1' : ''} → <b>${a + b}</b>`};
  },
  ergaenzen(level){
    let n, target;
    if(level === 1){ do { n = rnd(11, 98); } while(n % 10 === 0); target = Math.ceil(n / 10) * 10; }
    else if(level === 2){ n = rnd(1, 9) * 10; target = 100; }
    else { do { n = rnd(11, 98); } while(n % 10 === 0); target = 100; }
    const house = Math.random() < .5;
    const vis = house ? `<div class="hausnr"><span class="hh">🏠</span><span class="hs">${n}</span></div>`
      : `<div class="plate"><span class="eu">D</span><span class="pt">${pick(['MA·TH','RE·CH','FU·X','ZA·HL','PL·US'])} ${n}</span></div>`;
    const where = house ? `An dem Haus steht die Nummer <b>${n}</b>.` : `Das Auto hat die Nummer <b>${n}</b>.`;
    const nt = Math.ceil(n / 10) * 10;
    let hint, explain;
    if(level === 1){ hint = `Schau auf die Einer: ${n % 10} und wie viel ergeben zusammen 10?`; explain = `${n % 10} + ${10 - n % 10} = 10, also ${n} + <b>${target - n}</b> = ${target}.`; }
    else if(level === 2){ hint = `${n / 10} + ? = 10 – das ist wie bei den verliebten Zahlen!`; explain = `${n / 10} + ${10 - n / 10} = 10, also ${n} + <b>${100 - n}</b> = 100.`; }
    else { hint = `Erst bis zum nächsten Zehner: ${n} + ${nt - n} = ${nt}. Dann von ${nt} bis 100.`;
      explain = `Erst ${nt - n} bis zur ${nt}, dann ${100 - nt} bis zur 100. Also <b>${100 - n}</b>.${numberLine(n, nt, 100, '+' + (nt - n), '+' + (100 - nt))}`; }
    return {prompt: vis + say(`${where} Wie viel fehlt bis <b>${target}</b>?`) +
      `<div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>${target}</span></div>`,
      answer:target - n, text:`${n} + ? = ${target}`, hint, explain};
  },
  neuner(level, i, ctx){
    const limit = level === 1 ? 60 : 100;
    let c = ctx.chain;
    if(!c || c.items[c.items.length - 1] + c.step > limit){
      const step = level === 3 ? pick([9, 11, 19]) : 9;
      const start = level === 1 ? rnd(1, 9) : step === 19 ? rnd(1, 9) : rnd(1, 19);
      c = ctx.chain = {step, items:[start, start + step]};
    }
    const x = c.items[c.items.length - 1], st = c.step, ans = x + st;
    const shown = c.items.slice(-3);
    const trick = st === 9 ? ['+10', '−1', x + 10, `und dann eins weniger`] : st === 11 ? ['+10', '+1', x + 10, `und dann eins mehr`] : ['+20', '−1', x + 20, `und dann eins weniger`];
    c.items.push(ans);
    const name = st === 9 ? 'Neuner' : st === 11 ? 'Elfer' : 'Neunzehner';
    return {prompt: say(c.items.length === 3 && shown.length === 2 ? `Eine neue ${name}-Kette! Immer <b>+${st}</b>. Wie geht es weiter?` : `Immer <b>+${st}</b>. Welche Zahl kommt jetzt?`) +
      `<div class="chain">${shown.map((v, k) => `<span class="cb ${k === 0 && shown.length === 3 ? 'first' : ''}">${v}</span><span class="ca">+${st}<span>→</span></span>`).join('')}<span class="slot">?</span></div>`,
      answer:ans, text:`${x} + ${st}`,
      hint:`Der Trick: ${trick[0]}, dann ${trick[1]}. ${x} ${trick[0].replace('+', '+ ')} = ${trick[2]}, ${trick[3]}.`,
      explain:`${x} ${trick[0].replace('+', '+ ')} = ${trick[2]}, ${trick[1].replace('−', '− ').replace('+', '+ ')} → <b>${ans}</b>`};
  },
  raetsel(level){
    let op = Math.random() < .5 ? '+' : '-', s, k;
    if(level === 1){
      if(op === '+'){ s = rnd(1, 12); k = rnd(2, 20 - s); } else { s = rnd(6, 20); k = rnd(2, s - 1); }
    } else if(level === 2){
      if(op === '+'){ s = rnd(1, 6) * 10 + (Math.random() < .5 ? 0 : rnd(1, 9)); k = rnd(1, Math.max(1, Math.floor((100 - s) / 10) - 1)) * 10; }
      else { s = rnd(3, 9) * 10 + (Math.random() < .5 ? 0 : rnd(1, 9)); k = rnd(1, Math.floor(s / 10) - 1) * 10; }
    } else {
      if(op === '+'){ s = rnd(5, 70); k = rnd(5, Math.min(40, 100 - s)); } else { s = rnd(25, 99); k = rnd(5, Math.min(40, s - 5)); }
    }
    const r = op === '+' ? s + k : s - k, sym = op === '+' ? '+' : '−';
    const help = op === '+' ? minusHelp(r, k) : plusHelp(r, k);
    return {prompt: say(`Ich denke an eine Zahl und ${op === '+' ? `rechne <b>${k}</b> dazu` : `ziehe <b>${k}</b> ab`}. Das Ergebnis ist <b>${r}</b>. Welche Zahl war es?`) +
      `<div class="machine"><span class="slot">?</span><span class="arr">➜</span><span class="mop">${sym}${k}</span><span class="arr">➜</span><span>${r}</span></div>`,
      answer:s, text:`? ${sym} ${k} = ${r}`,
      hint:`Rechne rückwärts: ${r} ${op === '+' ? '−' : '+'} ${k} = ?<br><small>${help.hint}</small>`,
      explain:`${r} ${op === '+' ? '−' : '+'} ${k} = <b>${s}</b>. Probe: ${s} ${sym} ${k} = ${r} ✓`};
  },
  flunkern(level){
    let a, b, op = Math.random() < .65 ? '+' : '-';
    if(level === 1){ if(op === '+'){ a = rnd(2, 12); b = rnd(1, 20 - a); } else { a = rnd(5, 20); b = rnd(1, a - 1); } }
    else if(level === 2){
      if(op === '+'){ a = rnd(1, 8) * 10 + rnd(1, 9); b = rnd(1, 9 - Math.floor(a / 10)) * 10; }
      else { a = rnd(3, 9) * 10 + rnd(1, 9); b = rnd(1, Math.floor(a / 10) - 1) * 10; }
    } else {
      if(op === '+'){ a = rnd(15, 69); b = rnd(11, Math.max(11, 99 - a)); if(a + b > 100) b = 100 - a; }
      else { a = rnd(30, 99); b = rnd(11, a - 10); }
    }
    const correct = op === '+' ? a + b : a - b, sym = op === '+' ? '+' : '−';
    const isLie = Math.random() < .5;
    let shown = correct;
    if(isLie){ const opts = [10, -10, 1, -1, 2, -2].filter(d => correct + d >= 0 && correct + d <= (level === 1 ? 25 : 110)); shown = correct + pick(opts); }
    const help = op === '+' ? plusHelp(a, b) : minusHelp(a, b);
    return {mode:'binary', a, b, sym, correct, shown, isLie, text:`${a} ${sym} ${b} = ${shown}`,
      prompt: say(pick(['Ich hab gerechnet. Stimmt das – oder hab ich geflunkert?','Hmm, ist das richtig? Oder schummle ich?','Pass gut auf! Stimmt das?'])) +
        `<div class="tafel"><span>${a} ${sym} ${b} =</span><span class="shown">${shown}</span></div>`,
      answer:correct, hint:help.hint, explain:help.explain};
  }
};

async function runQuiz(s, g, level){
  const total = 10, ctx = {}, results = [];
  const body = frame(g, s, true);
  const dots = layer.querySelector('.dots');
  for(let i = 0; i < total; i++){
    dots.innerHTML = Array.from({length:total}, (_, k) => `<i class="${results[k] || (k === i ? 'cur' : '')}"></i>`).join('');
    const t = MAKERS[g.id](level, i, ctx);
    body.innerHTML = `<div class="task">${t.prompt}</div><div class="inp"></div>`;
    const taskEl = body.querySelector('.task'), inp = body.querySelector('.inp');
    let r;
    if(t.mode === 'binary') r = await flunkFlow(s, g, taskEl, inp, t);
    else { r = await ask(s, inp, Object.assign({}, t, {slot:taskEl.querySelector('.slot')})); record(g.id, r.ok, t.text, r.first, t.answer); }
    results.push(r.ok ? (r.tries === 1 ? 'p' : 'o') : 'x');
  }
  dots.innerHTML = results.map(c => `<i class="${c}"></i>`).join('');
  const good = results.filter(x => x !== 'x').length, perfect = results.filter(x => x === 'p').length;
  const st = state.games[g.id]; st.rounds++; st.best = Math.max(st.best, good);
  let extra = '';
  if(perfect >= 9 && level < 3){ st.level = level + 1; extra = `<div class="lvup">🚀 Stark! Nächstes Mal geht's mit Stufe ${level + 1} weiter.</div>`; }
  else if(good <= 4) extra = `<div class="tip" style="text-align:center">Üben macht schlau! Probier's gleich nochmal – du wirst jedes Mal schneller. 💪</div>`;
  save();
  await s.wait(300);
  endScreen(s, g, {big: good >= 9 ? '🏆' : good >= 6 ? '🎉' : '💪', title: good >= 9 ? 'Super gemacht!' : good >= 6 ? 'Gut gemacht!' : 'Weiter so!',
    text:`Du hast ${good} von ${total} Aufgaben gelöst.`, extra, win: good >= 7, again: () => startGame(g.id, st.level, 'fox')});
}

async function flunkFlow(s, g, taskEl, inp, t){
  inp.innerHTML = `<div class="hint" hidden></div><div class="bin"><button class="b-ok" data-c="ok"><span>✓</span>Stimmt</button><button class="b-lie" data-c="lie"><span>🤥</span>Geflunkert!</button></div><div class="next" hidden><button class="btn big">Weiter ➜</button></div>`;
  keyHandler = null;
  const choice = await new Promise(res => { inp.querySelector('.bin').onclick = e => { const b = e.target.closest('[data-c]'); if(b) res(b.dataset.c); }; });
  s.check();
  const right = (choice === 'lie') === t.isLie, shownEl = taskEl.querySelector('.shown'), hintEl = inp.querySelector('.hint');
  record(g.id, right, t.text, choice === 'lie' ? 'geflunkert' : 'stimmt', t.isLie ? `geflunkert (${t.correct})` : 'stimmt');
  if(right && t.isLie){
    sfx.ok(); praise('Erwischt! 🕵️'); shownEl.classList.add('strike');
    await s.wait(700);
    const slot = document.createElement('span'); slot.className = 'slot'; slot.textContent = '?';
    taskEl.querySelector('.tafel').appendChild(slot);
    taskEl.querySelector('.bub').innerHTML = `Du hast mich erwischt! 🙈 Was ist denn <b>richtig</b>? (Extra-Stern!)`;
    const r2 = await ask(s, inp, {answer:t.correct, slot, hint:t.hint, explain:t.explain});
    record(g.id, r2.ok, `${t.a} ${t.sym} ${t.b}`, r2.first, t.correct);
    return {ok:true, tries:1};
  }
  if(right){ sfx.ok(); praise('Stimmt genau!'); shownEl.classList.add('good'); await s.wait(1100); return {ok:true, tries:1}; }
  sfx.bad();
  inp.querySelector('.bin').hidden = true;
  hintEl.innerHTML = t.isLie ? `<span class="hi">😜</span><div>Ich hab geflunkert! Richtig ist ${t.explain}.</div>` : `<span class="hi">🦊</span><div>Das hat wirklich gestimmt: ${t.a} ${t.sym} ${t.b} = <b>${t.correct}</b>.</div>`;
  hintEl.hidden = false; hintEl.classList.add('sol');
  if(t.isLie) shownEl.classList.add('strike'); else shownEl.classList.add('good');
  const nx = inp.querySelector('.next'); nx.hidden = false;
  await new Promise(res => { nx.querySelector('button').onclick = () => { sfx.tap(); res(); }; });
  s.check();
  return {ok:false, tries:2};
}

/* ---------- Rätsel stellen (Kind fragt den Fuchs) ---------- */
function startMaker(){
  const g = GAME.raetsel, s = newSession('raetsel'); s.playing = true;
  runMaker(s, g).catch(err => { if(err !== ABORT) console.error(err); });
}
async function runMaker(s, g){
  const body = frame(g, s);
  while(true){
    let op = '+', vals = {k:'', r:''}, field = 'k';
    body.innerHTML = `<div class="task">${say('Jetzt du! Denk dir eine <b>geheime Zahl</b> und verrate sie mir nicht. Sag mir nur, was du damit rechnest:')}
      <div class="builder">
        <div class="opsw"><button data-op="+" class="on">➕ dazu rechnen</button><button data-op="-">➖ abziehen</button></div>
        <div class="brow"><span id="kLab">Ich rechne dazu:</span><button class="fld on" data-f="k">?</button></div>
        <div class="brow"><span>Das Ergebnis ist:</span><button class="fld" data-f="r">?</button></div>
      </div></div><div class="inp">${padHtml()}</div>`;
    const flds = {k:body.querySelector('[data-f="k"]'), r:body.querySelector('[data-f="r"]')};
    const paint = () => { for(const f of ['k', 'r']){ flds[f].textContent = vals[f] || '?'; flds[f].classList.toggle('on', f === field); } };
    await new Promise(res => {
      const key = k => {
        if(k === 'del'){ vals[field] = vals[field].slice(0, -1); }
        else if(k === 'ok'){
          if(!vals[field]){ bounce(flds[field], 'nudge'); return; }
          if(field === 'k' && !vals.r){ field = 'r'; }
          else if(vals.k && vals.r){ keyHandler = null; res(); return; }
          else field = vals.k ? 'r' : 'k';
        } else if(vals[field].length < 3){ vals[field] = (vals[field] === '0' ? '' : vals[field]) + k; }
        sfx.tap(); paint();
      };
      keyHandler = key;
      body.onclick = e => {
        const b = e.target.closest('[data-k]'); if(b){ key(b.dataset.k); return; }
        const o = e.target.closest('[data-op]');
        if(o){ op = o.dataset.op; body.querySelectorAll('[data-op]').forEach(x => x.classList.toggle('on', x === o));
          $('#kLab').textContent = op === '+' ? 'Ich rechne dazu:' : 'Ich ziehe ab:'; sfx.tap(); return; }
        const f = e.target.closest('[data-f]'); if(f){ field = f.dataset.f; sfx.tap(); paint(); }
      };
    });
    body.onclick = null; s.check();
    const k = +vals.k, r = +vals.r, sym = op === '+' ? '+' : '−';
    const secret = op === '+' ? r - k : r + k;
    body.querySelector('.inp').innerHTML = '';
    const bub = body.querySelector('.bub');
    bub.innerHTML = 'Hmm … lass mich überlegen … 🤔';
    await s.wait(1400);
    let ok = true;
    if(op === '+' && r < k){ ok = false; bub.innerHTML = `Moment! Wenn du <b>${k}</b> dazu rechnest, kann nicht <b>${r}</b> herauskommen – das Ergebnis muss größer sein. Prüf nochmal! 🧐`; }
    else if(secret > 100){ ok = false; bub.innerHTML = `Puh, dann wäre deine Zahl größer als 100 (${secret})! Probier ein kleineres Rätsel. 😅`; }
    if(!ok){
      body.querySelector('.inp').innerHTML = `<div class="next"><button class="btn big">Nochmal ➜</button></div>`;
      await new Promise(res => { body.querySelector('.inp button').onclick = res; }); s.check(); continue;
    }
    sfx.ok();
    bub.innerHTML = `Ich hab's! Deine geheime Zahl ist die <b>${secret}</b>! Denn ${secret} ${sym} ${k} = ${r}. Stimmt's?`;
    body.querySelector('.inp').innerHTML = `<div class="bin"><button class="b-ok" data-c="y"><span>🎉</span>Stimmt!</button><button class="b-lie" data-c="n"><span>🙈</span>Nein …</button></div>`;
    const c = await new Promise(res => { body.querySelector('.bin').onclick = e => { const b = e.target.closest('[data-c]'); if(b) res(b.dataset.c); }; });
    s.check();
    if(c === 'y'){ record('raetsel', true, `Rätsel: ? ${sym} ${k} = ${r}`, secret, secret); praise('Toll gerätselt!'); confetti(30);
      bub.innerHTML = `Juhu! Das war ein tolles Rätsel. Du bekommst einen Stern! ⭐`; }
    else bub.innerHTML = `Hmm, rechne nochmal nach: ${r} ${op === '+' ? '−' : '+'} ${k} = ${secret}. Hast du dich vielleicht verrechnet? Das passiert auch Profis! 😊`;
    body.querySelector('.inp').innerHTML = `<div class="next" style="flex-direction:column;align-items:center;gap:12px"><button class="btn big" data-more>Noch ein Rätsel</button><button class="btn big ghost" data-done>Fertig</button></div>`;
    const more = await new Promise(res => { body.querySelector('.inp').onclick = e => {
      if(e.target.closest('[data-more]')) res(true); else if(e.target.closest('[data-done]')) res(false); }; });
    s.check(); sfx.tap();
    if(!more){ s.playing = false; openIntro('raetsel'); return; }
  }
}

/* ---------- Spiel 7 & 8: Wettrennen ---------- */
function makePlayers(mode, start){
  return [{name:kidName(), av:state.profile.avatar, human:true, v:start},
    mode === 'duo' ? {name:'Mitspieler', av:'🧑', human:true, v:start} : {name:'Fuchs', av:'🦊', human:false, v:start}];
}
async function runRace(s, g, level, mode){
  const cards = g.id === 'karten';
  const start = cards ? 0 : (level === 1 ? 30 : 100), target = cards ? (level === 1 ? 50 : 100) : (level === 1 ? 10 : 50);
  const nDice = !cards && level === 3 ? 2 : 1;
  const P = makePlayers(mode, start);
  const body = frame(g, s);
  const pct = v => Math.max(0, Math.min(100, cards ? v / target * 100 : (start - v) / (start - target) * 100));
  body.innerHTML = `<div class="lanes">${P.map((p, i) => `<div class="lane" data-p="${i}"><div class="lt"><span>${p.av} ${esc(p.name)}</span><span class="lv">${p.v}</span></div>
      <div class="track"><i style="width:0%"></i><span class="tok" style="left:0%">${p.av}</span><span class="fin">🏁</span></div></div>`).join('')}</div>
    <div class="stage"><div class="turn"></div><div class="play"></div><div class="eqw"></div></div><div class="inp"></div>`;
  const lanes = body.querySelectorAll('.lane'), turnEl = body.querySelector('.turn'), play = body.querySelector('.play'), eqw = body.querySelector('.eqw'), inp = body.querySelector('.inp');
  const paint = () => P.forEach((p, i) => { const L = lanes[i]; L.querySelector('.lv').textContent = p.v;
    L.querySelector('.track i').style.width = pct(p.v) + '%'; L.querySelector('.tok').style.left = pct(p.v) + '%'; });
  paint();
  let turn = 0, winner = null;
  while(!winner){
    const p = P[turn];
    lanes.forEach((L, i) => L.classList.toggle('act', i === turn));
    eqw.innerHTML = ''; inp.innerHTML = '';
    if(cards){
      play.innerHTML = `<div class="deckrow"><button class="deck ${p.human ? 'wiggle' : ''}" aria-label="Karte ziehen">🦊</button></div>`;
      turnEl.textContent = p.human ? `${p.name === 'Du' ? 'Du bist' : p.name + ' ist'} dran – tippe auf die Karten!` : 'Der Fuchs ist dran …';
    } else {
      play.innerHTML = `<div class="dice">${Array.from({length:nDice}, () => `<button class="die ${p.human ? 'wiggle' : ''}" aria-label="Würfeln">${dieFace(6)}</button>`).join('')}</div>`;
      turnEl.textContent = p.human ? `${p.name === 'Du' ? 'Du bist' : p.name + ' ist'} dran – tippe zum Würfeln!` : 'Der Fuchs würfelt …';
    }
    if(p.human) await waitTap(s, play); else await s.wait(900);
    let add, sub = '';
    if(cards){
      add = level === 3 ? rnd(3, 19) : rnd(1, 10); sfx.flip();
      play.querySelector('.deckrow').innerHTML += `<div class="pcard" data-n="${add}">${add}</div>`;
      play.querySelector('.deck').classList.remove('wiggle');
    } else {
      const dEls = [...play.querySelectorAll('.die')]; dEls.forEach(d => d.classList.remove('wiggle'));
      const vals = await rollDice(s, dEls);
      add = vals.reduce((a, b) => a + b, 0);
      if(nDice === 2) sub = `<div class="sumtxt">${vals[0]} + ${vals[1]} = ${add}</div>`;
    }
    await s.wait(500);
    const nv = cards ? p.v + add : p.v - add, sym = cards ? '+' : '−';
    eqw.innerHTML = `${sub}<div class="eq"><span>${p.v}</span><span class="op">${sym}</span><span>${add}</span><span class="op">=</span><span class="slot">?</span></div>`;
    const slot = eqw.querySelector('.slot');
    if(p.human){
      turnEl.textContent = p.name === 'Du' ? 'Rechne aus: Was ist deine neue Zahl?' : `${p.name}, was ist deine neue Zahl?`;
      const help = cards ? plusHelp(p.v, add) : minusHelp(p.v, add);
      const r = await ask(s, inp, {answer:nv, slot, hint:help.hint, explain:help.explain});
      record(g.id, r.ok, `${p.v} ${sym} ${add}`, r.first, nv);
    } else {
      turnEl.textContent = 'Der Fuchs rechnet … 🤔';
      await s.wait(1100); slot.textContent = nv; slot.classList.add('ok'); sfx.ok(); await s.wait(900);
    }
    p.v = nv; paint(); await s.wait(700);
    if(cards ? p.v >= target : p.v <= target) winner = p;
    turn = 1 - turn;
  }
  const st = state.games[g.id]; st.rounds++;
  const kidWon = winner === P[0];
  if(kidWon) st.wins++;
  save();
  await s.wait(300);
  endScreen(s, g, {big: winner.human ? '🏆' : '🦊', win: winner.human,
    title: mode === 'duo' ? `${esc(winner.name)} gewinnt!` : kidWon ? 'Du hast gewonnen!' : 'Der Fuchs war schneller!',
    text: `${esc(winner.name)} ist zuerst bei ${target} angekommen.${!winner.human ? ' Nächstes Mal schaffst du es! 💪' : ''}`,
    again: () => startGame(g.id, level, mode)});
}
async function rollDice(s, dEls){
  sfx.flip();
  dEls.forEach(d => bounce(d, 'roll'));
  for(let i = 0; i < 7; i++){ dEls.forEach(d => d.innerHTML = dieFace(rnd(1, 6))); await s.wait(80); }
  const vals = dEls.map(d => { const v = rnd(1, 6); d.innerHTML = dieFace(v); return v; });
  sfx.tap();
  return vals;
}

/* ---------- Spiel 9: Süßes oder Rechnen ---------- */
const BOARD_N = 20, PUMP = new Set([2, 4, 6, 8, 11, 13, 15, 17, 19]), BAT = new Set([5, 10]);
function cellPos(i){
  if(i <= 6) return [0, i];
  if(i <= 10) return [i - 6, 6];
  if(i <= 16) return [4, 6 - (i - 10)];
  return [4 - (i - 16), 0];
}
function kTask(level){
  let a, b;
  if(level === 1){ a = rnd(2, 15); b = rnd(2, 20 - a); }
  else if(level === 2){ if(Math.random() < .5){ a = rnd(11, 89); b = rnd(2, 9); if(a + b > 100) a = 100 - b; } else { a = rnd(11, 79); b = rnd(1, Math.floor((100 - a) / 10)) * 10; } }
  else { a = rnd(15, 64); b = rnd(12, 99 - a); }
  return {a, b, ans:a + b};
}
async function runKuerbis(s, g, level, mode){
  const P = makePlayers(mode, 0).map(p => Object.assign(p, {pos:0, sw:0}));
  const body = frame(g, s); body.classList.add('kbody');
  let cells = '';
  for(let i = 0; i < BOARD_N; i++){
    const [r, c] = cellPos(i), cls = i === 0 ? 'start' : PUMP.has(i) ? 'pump' : BAT.has(i) ? 'bat' : '';
    cells += `<div class="cell ${cls}" data-i="${i}" style="grid-row:${r + 1};grid-column:${c + 1}"><span class="fe">${i === 0 ? 'START' : PUMP.has(i) ? '🎃' : BAT.has(i) ? '🦇' : ''}</span><span class="tks"></span></div>`;
  }
  body.innerHTML = `<div class="board">${cells}<div class="center"><div class="swt">${P.map((p, i) => `<div class="swr" data-p="${i}">${p.av}${SWEETS.map(x => `<span class="sl">${x}</span>`).join('')}</div>`).join('')}</div>
      <button class="die" aria-label="Würfeln">${dieFace(5)}</button></div></div>
    <div class="kpanel"><div class="turn"></div><div class="kmsg"></div></div><div class="sheet" hidden></div>`;
  const dieEl = body.querySelector('.center .die'), turnEl = body.querySelector('.turn'), msg = body.querySelector('.kmsg'), sheet = body.querySelector('.sheet');
  const rows = body.querySelectorAll('.swr');
  const paintTokens = () => {
    body.querySelectorAll('.cell').forEach(c => { c.querySelector('.tks').innerHTML = ''; c.classList.remove('has'); });
    P.forEach(p => { const c = body.querySelector(`.cell[data-i="${p.pos}"]`); c.classList.add('has'); c.querySelector('.tks').innerHTML += `<span class="tk">${p.av}</span>`; });
  };
  const paintSweets = () => P.forEach((p, i) => rows[i].querySelectorAll('.sl').forEach((x, k) => x.classList.toggle('got', k < p.sw)));
  paintTokens(); paintSweets();
  let turn = 0, winner = null;
  while(!winner){
    const p = P[turn];
    rows.forEach((r, i) => r.classList.toggle('act', i === turn));
    turnEl.textContent = p.human ? `${p.name === 'Du' ? 'Du bist' : p.name + ' ist'} dran – tippe auf den Würfel!` : 'Der Fuchs würfelt …';
    dieEl.classList.toggle('wiggle', p.human);
    if(p.human) await waitTap(s, dieEl); else await s.wait(900);
    dieEl.classList.remove('wiggle'); msg.textContent = '';
    const [d] = await rollDice(s, [dieEl]);
    await s.wait(350);
    for(let k = 0; k < d; k++){ p.pos = (p.pos + 1) % BOARD_N; paintTokens(); sfx.step(); await s.wait(260); }
    if(BAT.has(p.pos)){ msg.textContent = '🦇 Fledermaus! Nochmal würfeln!'; await s.wait(1200); continue; }
    if(PUMP.has(p.pos)){
      const t = kTask(level);
      sheet.hidden = false;
      const vis = level === 3
        ? `<div class="kwrap"><div class="schr"><div>${t.a}</div><div>+ ${t.b}</div><div class="ln"></div><div><span class="slot">?</span></div></div></div>`
        : `<div class="eq"><span>${t.a}</span><span class="op">+</span><span>${t.b}</span><span class="op">=</span><span class="slot">?</span></div>`;
      sheet.innerHTML = `<div class="kt">🎃 Kürbiskarte für ${p.av} ${esc(p.name)}</div>${vis}<div class="inp"></div>`;
      sfx.flip();
      const slot = sheet.querySelector('.slot');
      let got;
      if(p.human){
        const help = plusHelp(t.a, t.b);
        const r = await ask(s, sheet.querySelector('.inp'), {answer:t.ans, slot, hint:help.hint, explain:help.explain});
        record(g.id, r.ok, `${t.a} + ${t.b}`, r.first, t.ans); got = r.ok;
      } else {
        sheet.querySelector('.inp').innerHTML = `<div class="kmsg">Der Fuchs rechnet … 🤔</div>`;
        await s.wait(1300);
        got = Math.random() < .82;
        const fa = got ? t.ans : t.ans + pick([1, -1, 10]);
        slot.textContent = fa;
        if(got){ slot.classList.add('ok'); sfx.ok(); sheet.querySelector('.inp').innerHTML = `<div class="kmsg">Richtig gerechnet! 🦊</div>`; }
        else { bounce(slot, 'bad'); sfx.bad(); sheet.querySelector('.inp').innerHTML = `<div class="kmsg">Der Fuchs hat sich verrechnet! 🙈 Richtig ist ${t.ans}. Kein Süßes für ihn!</div>`; }
        await s.wait(1700);
      }
      sheet.hidden = true; sheet.innerHTML = '';
      if(got){ p.sw++; paintSweets(); sfx.sticker(); msg.textContent = `${p.av} bekommt ${SWEETS[p.sw - 1]}!`; await s.wait(900); }
      if(p.sw >= SWEETS.length) winner = p;
    } else {
      msg.textContent = p.pos === 0 ? 'Eine Runde geschafft! 🏁' : '';
      await s.wait(500);
    }
    turn = 1 - turn;
  }
  const st = state.games[g.id]; st.rounds++; if(winner === P[0]) st.wins++; save();
  await s.wait(300);
  endScreen(s, g, {big: winner.human ? '🍭' : '🦊', win: winner.human,
    title: mode === 'duo' ? `${esc(winner.name)} gewinnt!` : winner === P[0] ? 'Alle Süßigkeiten gesammelt!' : 'Der Fuchs hat alles gesammelt!',
    text: winner === P[0] || mode === 'duo' ? 'Süßes oder Rechnen – du kannst beides! 🎃' : 'Knapp! Beim nächsten Mal holst du dir alle Süßigkeiten. 💪',
    again: () => startGame(g.id, level, mode)});
}
