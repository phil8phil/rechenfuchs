/* ---------- Aufgaben-Generatoren (Quiz-Spiele) ---------- */
const MAKERS = {
  verliebt(level){
    if(level === 1){
      const n = rnd(0, 10);
      return {prompt: say(`Ich sage <b>${n}</b>. Welche Zahl ist in die ${n} verliebt?`) +
        `<div class="eq">💞</div><div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>10</span></div>`,
        mode:'choices', choices:[...Array(11).keys()], answer:10 - n, text:`${n} + ? = 10`,
        hint:`Wie viele Plätze sind im Zehnerfeld noch frei?${tenFrame(n)}`,
        explain:`${n} + ${10 - n} = 10. Die beiden sind verliebt! 💞`};
    }
    if(level === 2){
      const n = rnd(1, 9) * 10;
      return {prompt: say(`Ich sage <b>${n}</b>. Wer ist in die ${n} verliebt? Zusammen sind sie <b>100</b>.`) +
        `<div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>100</span></div>`,
        answer:100 - n, text:`${n} + ? = 100`,
        hint:`Denk an die verliebten Zahlen bis 10: ${n / 10} + ${10 - n / 10} = 10. Mit Zehnern ist es genauso!`,
        explain:`${n / 10} + ${10 - n / 10} = 10, also ${n} + <b>${100 - n}</b> = 100.`};
    }
    let n; do { n = rnd(11, 89); } while(n % 10 === 0);
    const nt = Math.ceil(n / 10) * 10;
    return {prompt: say(`Ich sage <b>${n}</b>. Wer ist in die ${n} verliebt? Zusammen sind sie <b>100</b>.`) +
      `<div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>100</span></div>`,
      answer:100 - n, text:`${n} + ? = 100`,
      hint:`Erst bis zum nächsten Zehner: ${n} + ${nt - n} = ${nt}. Wie viel fehlt dann noch bis 100?`,
      explain:`${n} + ${nt - n} = ${nt}, dann ${nt} + ${100 - nt} = 100. Zusammen <b>${100 - n}</b>.${numberLine(n, nt, 100, '+' + (nt - n), '+' + (100 - nt))}`};
  },
  doppel(level){
    if(level === 1){
      const a = rnd(1, 10);
      return {prompt: say(`Verdopple die <b>${a}</b>!`) + `<div class="eq"><span>${a}</span><span class="op">+</span><span>${a}</span><span class="op">=</span><span class="slot">?</span></div>`,
        answer:2 * a, text:`${a} + ${a}`, hint:`Stell dir ${a} Punkte zweimal vor:${dotRow(a)}${dotRow(a, 'b')}`, explain:`${a} + ${a} = <b>${2 * a}</b>`};
    }
    if(level === 2){
      if(Math.random() < .25){ const a = rnd(6, 12);
        return {prompt: say(`Verdopple die <b>${a}</b>!`) + `<div class="eq"><span>${a}</span><span class="op">+</span><span>${a}</span><span class="op">=</span><span class="slot">?</span></div>`,
          answer:2 * a, text:`${a} + ${a}`, hint:`Verdopple erst die 10, dann den Rest.`, explain:`${a} + ${a} = <b>${2 * a}</b>`}; }
      const m = rnd(2, 9), up = Math.random() < .5, a = up ? m : m + 1, b = up ? m + 1 : m;
      return {prompt: say(`Fast verdoppelt! Rechne mit dem Trick.`) + `<div class="eq"><span>${a}</span><span class="op">+</span><span>${b}</span><span class="op">=</span><span class="slot">?</span></div>`,
        answer:a + b, text:`${a} + ${b}`, hint:`Verdopple zuerst: ${m} + ${m} = ${2 * m}. Und eins mehr?`,
        explain:`${m} + ${m} = ${2 * m}, und eins mehr ist <b>${a + b}</b>.`};
    }
    const a = pick([11,12,13,14,15,20,21,22,23,24,25,30,31,32,33,34,35,40,41,42,43,44,45]), near = Math.random() < .4;
    const T = a - a % 10, o = a % 10, b = near ? a + 1 : a;
    return {prompt: say(near ? `Fast verdoppelt – große Zahlen!` : `Verdopple die <b>${a}</b>!`) +
      `<div class="eq"><span>${a}</span><span class="op">+</span><span>${b}</span><span class="op">=</span><span class="slot">?</span></div>`,
      answer:a + b, text:`${a} + ${b}`,
      hint:`Verdopple Zehner und Einer einzeln: ${T} + ${T} = ${2 * T}${o ? `, ${o} + ${o} = ${2 * o}` : ''}.${near ? ' Dann noch eins mehr.' : ''}`,
      explain:`${T} + ${T} = ${2 * T}${o ? `, ${o} + ${o} = ${2 * o}` : ''}${near ? ', plus 1' : ''} → <b>${a + b}</b>`};
  },
  ergaenzen(level){
    let n, target;
    if(level === 1){ do { n = rnd(11, 98); } while(n % 10 === 0); target = Math.ceil(n / 10) * 10; }
    else if(level === 2){ n = rnd(1, 9) * 10; target = 100; }
    else { do { n = rnd(11, 98); } while(n % 10 === 0); target = 100; }
    const house = Math.random() < .5;
    const vis = house ? `<div class="hausnr"><span class="hh">🏠</span><span class="hs">${n}</span></div>`
      : `<div class="plate"><span class="eu">D</span><span class="pt">${pick(['MA·TH','RE·CH','FU·X','ZA·HL','PL·US'])} ${n}</span></div>`;
    const where = house ? `An dem Haus steht die Nummer <b>${n}</b>.` : `Das Auto hat die Nummer <b>${n}</b>.`;
    const nt = Math.ceil(n / 10) * 10;
    let hint, explain;
    if(level === 1){ hint = `Schau auf die Einer: ${n % 10} und wie viel ergeben zusammen 10?`; explain = `${n % 10} + ${10 - n % 10} = 10, also ${n} + <b>${target - n}</b> = ${target}.`; }
    else if(level === 2){ hint = `${n / 10} + ? = 10 – das ist wie bei den verliebten Zahlen!`; explain = `${n / 10} + ${10 - n / 10} = 10, also ${n} + <b>${100 - n}</b> = 100.`; }
    else { hint = `Erst bis zum nächsten Zehner: ${n} + ${nt - n} = ${nt}. Dann von ${nt} bis 100.`;
      explain = `Erst ${nt - n} bis zur ${nt}, dann ${100 - nt} bis zur 100. Also <b>${100 - n}</b>.${numberLine(n, nt, 100, '+' + (nt - n), '+' + (100 - nt))}`; }
    return {prompt: vis + say(`${where} Wie viel fehlt bis <b>${target}</b>?`) +
      `<div class="eq"><span>${n}</span><span class="op">+</span><span class="slot">?</span><span class="op">=</span><span>${target}</span></div>`,
      answer:target - n, text:`${n} + ? = ${target}`, hint, explain};
  },
  neuner(level, i, ctx){
    const limit = level === 1 ? 60 : 100;
    let c = ctx.chain;
    if(!c || c.items[c.items.length - 1] + c.step > limit){
      const step = level === 3 ? pick([9, 11, 19]) : 9;
      const start = level === 1 ? rnd(1, 9) : step === 19 ? rnd(1, 9) : rnd(1, 19);
      c = ctx.chain = {step, items:[start, start + step]};
    }
    const x = c.items[c.items.length - 1], st = c.step, ans = x + st;
    const shown = c.items.slice(-3);
    const trick = st === 9 ? ['+10', '−1', x + 10, `und dann eins weniger`] : st === 11 ? ['+10', '+1', x + 10, `und dann eins mehr`] : ['+20', '−1', x + 20, `und dann eins weniger`];
    c.items.push(ans);
    const name = st === 9 ? 'Neuner' : st === 11 ? 'Elfer' : 'Neunzehner';
    return {prompt: say(c.items.length === 3 && shown.length === 2 ? `Eine neue ${name}-Kette! Immer <b>+${st}</b>. Wie geht es weiter?` : `Immer <b>+${st}</b>. Welche Zahl kommt jetzt?`) +
      `<div class="chain">${shown.map((v, k) => `<span class="cb ${k === 0 && shown.length === 3 ? 'first' : ''}">${v}</span><span class="ca">+${st}<span>→</span></span>`).join('')}<span class="slot">?</span></div>`,
      answer:ans, text:`${x} + ${st}`,
      hint:`Der Trick: ${trick[0]}, dann ${trick[1]}. ${x} ${trick[0].replace('+', '+ ')} = ${trick[2]}, ${trick[3]}.`,
      explain:`${x} ${trick[0].replace('+', '+ ')} = ${trick[2]}, ${trick[1].replace('−', '− ').replace('+', '+ ')} → <b>${ans}</b>`};
  },
  raetsel(level){
    let op = Math.random() < .5 ? '+' : '-', s, k;
    if(level === 1){
      if(op === '+'){ s = rnd(1, 12); k = rnd(2, 20 - s); } else { s = rnd(6, 20); k = rnd(2, s - 1); }
    } else if(level === 2){
      if(op === '+'){ s = rnd(1, 6) * 10 + (Math.random() < .5 ? 0 : rnd(1, 9)); k = rnd(1, Math.max(1, Math.floor((100 - s) / 10) - 1)) * 10; }
      else { s = rnd(3, 9) * 10 + (Math.random() < .5 ? 0 : rnd(1, 9)); k = rnd(1, Math.floor(s / 10) - 1) * 10; }
    } else {
      if(op === '+'){ s = rnd(5, 70); k = rnd(5, Math.min(40, 100 - s)); } else { s = rnd(25, 99); k = rnd(5, Math.min(40, s - 5)); }
    }
    const r = op === '+' ? s + k : s - k, sym = op === '+' ? '+' : '−';
    const help = op === '+' ? minusHelp(r, k) : plusHelp(r, k);
    return {prompt: say(`Ich denke an eine Zahl und ${op === '+' ? `rechne <b>${k}</b> dazu` : `ziehe <b>${k}</b> ab`}. Das Ergebnis ist <b>${r}</b>. Welche Zahl war es?`) +
      `<div class="machine"><span class="slot">?</span><span class="arr">➜</span><span class="mop">${sym}${k}</span><span class="arr">➜</span><span>${r}</span></div>`,
      answer:s, text:`? ${sym} ${k} = ${r}`,
      hint:`Rechne rückwärts: ${r} ${op === '+' ? '−' : '+'} ${k} = ?<br><small>${help.hint}</small>`,
      explain:`${r} ${op === '+' ? '−' : '+'} ${k} = <b>${s}</b>. Probe: ${s} ${sym} ${k} = ${r} ✓`};
  },
  flunkern(level){
    let a, b, op = Math.random() < .65 ? '+' : '-';
    if(level === 1){ if(op === '+'){ a = rnd(2, 12); b = rnd(1, 20 - a); } else { a = rnd(5, 20); b = rnd(1, a - 1); } }
    else if(level === 2){
      if(op === '+'){ a = rnd(1, 8) * 10 + rnd(1, 9); b = rnd(1, 9 - Math.floor(a / 10)) * 10; }
      else { a = rnd(3, 9) * 10 + rnd(1, 9); b = rnd(1, Math.floor(a / 10) - 1) * 10; }
    } else {
      if(op === '+'){ a = rnd(15, 69); b = rnd(11, Math.max(11, 99 - a)); if(a + b > 100) b = 100 - a; }
      else { a = rnd(30, 99); b = rnd(11, a - 10); }
    }
    const correct = op === '+' ? a + b : a - b, sym = op === '+' ? '+' : '−';
    const isLie = Math.random() < .5;
    let shown = correct;
    if(isLie){ const opts = [10, -10, 1, -1, 2, -2].filter(d => correct + d >= 0 && correct + d <= (level === 1 ? 25 : 110)); shown = correct + pick(opts); }
    const help = op === '+' ? plusHelp(a, b) : minusHelp(a, b);
    return {mode:'binary', a, b, sym, correct, shown, isLie, text:`${a} ${sym} ${b} = ${shown}`,
      prompt: say(pick(['Ich hab gerechnet. Stimmt das – oder hab ich geflunkert?','Hmm, ist das richtig? Oder schummle ich?','Pass gut auf! Stimmt das?'])) +
        `<div class="tafel"><span>${a} ${sym} ${b} =</span><span class="shown">${shown}</span></div>`,
      answer:correct, hint:help.hint, explain:help.explain};
  }
};

async function runQuiz(s, g, level){
  const total = 10, ctx = {}, results = [];
  const body = frame(g, s, true); body.classList.add('quizb');
  const dots = layer.querySelector('.dots');
  for(let i = 0; i < total; i++){
    dots.innerHTML = Array.from({length:total}, (_, k) => `<i class="${results[k] || (k === i ? 'cur' : '')}"></i>`).join('');
    const t = MAKERS[g.id](level, i, ctx);
    body.innerHTML = `<div class="task">${t.prompt}</div><div class="inp"></div>`;
    const taskEl = body.querySelector('.task'), inp = body.querySelector('.inp');
    let r;
    if(t.mode === 'binary') r = await flunkFlow(s, g, taskEl, inp, t);
    else { r = await ask(s, inp, Object.assign({}, t, {slot:taskEl.querySelector('.slot')})); record(g.id, r.ok, t.text, r.first, t.answer); }
    results.push(r.ok ? (r.tries === 1 ? 'p' : 'o') : 'x');
  }
  dots.innerHTML = results.map(c => `<i class="${c}"></i>`).join('');
  const good = results.filter(x => x !== 'x').length, perfect = results.filter(x => x === 'p').length;
  const st = state.games[g.id]; st.rounds++; st.best = Math.max(st.best, good);
  let extra = '';
  if(perfect >= 9 && level < 3){ st.level = level + 1; extra = `<div class="lvup">🚀 Stark! Nächstes Mal geht's mit Stufe ${level + 1} weiter.</div>`; }
  else if(good <= 4) extra = `<div class="tip" style="text-align:center">Üben macht schlau! Probier's gleich nochmal – du wirst jedes Mal schneller. 💪</div>`;
  save();
  await s.wait(300);
  endScreen(s, g, {big: good >= 9 ? '🏆' : good >= 6 ? '🎉' : '💪', title: good >= 9 ? 'Super gemacht!' : good >= 6 ? 'Gut gemacht!' : 'Weiter so!',
    text:`Du hast ${good} von ${total} Aufgaben gelöst.`, extra, win: good >= 7, again: () => startGame(g.id, st.level, 'fox')});
}

async function flunkFlow(s, g, taskEl, inp, t){
  inp.innerHTML = `<div class="hint" hidden></div><div class="bin"><button class="b-ok" data-c="ok"><span>✓</span>Stimmt</button><button class="b-lie" data-c="lie"><span>🤥</span>Geflunkert!</button></div><div class="next" hidden><button class="btn big">Weiter ➜</button></div>`;
  keyHandler = null;
  const choice = await new Promise(res => { inp.querySelector('.bin').onclick = e => { const b = e.target.closest('[data-c]'); if(b) res(b.dataset.c); }; });
  s.check();
  const right = (choice === 'lie') === t.isLie, shownEl = taskEl.querySelector('.shown'), hintEl = inp.querySelector('.hint');
  record(g.id, right, t.text, choice === 'lie' ? 'geflunkert' : 'stimmt', t.isLie ? `geflunkert (${t.correct})` : 'stimmt');
  if(right && t.isLie){
    sfx.ok(); praise('Erwischt! 🕵️'); shownEl.classList.add('strike');
    await s.wait(700);
    const slot = document.createElement('span'); slot.className = 'slot'; slot.textContent = '?';
    taskEl.querySelector('.tafel').appendChild(slot);
    taskEl.querySelector('.bub').innerHTML = `Du hast mich erwischt! 🙈 Was ist denn <b>richtig</b>? (Extra-Stern!)`;
    const r2 = await ask(s, inp, {answer:t.correct, slot, hint:t.hint, explain:t.explain});
    record(g.id, r2.ok, `${t.a} ${t.sym} ${t.b}`, r2.first, t.correct);
    return {ok:true, tries:1};
  }
  if(right){ sfx.ok(); praise('Stimmt genau!'); shownEl.classList.add('good'); await s.wait(1100); return {ok:true, tries:1}; }
  sfx.bad();
  inp.querySelector('.bin').hidden = true;
  hintEl.innerHTML = t.isLie ? `<span class="hi">😜</span><div>Ich hab geflunkert! Richtig ist ${t.explain}.</div>` : `<span class="hi">🦊</span><div>Das hat wirklich gestimmt: ${t.a} ${t.sym} ${t.b} = <b>${t.correct}</b>.</div>`;
  hintEl.hidden = false; hintEl.classList.add('sol');
  if(t.isLie) shownEl.classList.add('strike'); else shownEl.classList.add('good');
  const nx = inp.querySelector('.next'); nx.hidden = false;
  await new Promise(res => { nx.querySelector('button').onclick = () => { sfx.tap(); res(); }; });
  s.check();
  return {ok:false, tries:2};
}

/* ---------- Rätsel stellen (Kind fragt den Fuchs) ---------- */
function startMaker(){
  const g = GAME.raetsel, s = newSession('raetsel'); s.playing = true;
  runMaker(s, g).catch(err => { if(err !== ABORT) console.error(err); });
}
async function runMaker(s, g){
  const body = frame(g, s); body.classList.add('quizb');
  while(true){
    let op = '+', vals = {k:'', r:''}, field = 'k';
    body.innerHTML = `<div class="task">${say('Jetzt du! Denk dir eine <b>geheime Zahl</b> und verrate sie mir nicht. Sag mir nur, was du damit rechnest:')}
      <div class="builder">
        <div class="opsw"><button data-op="+" class="on">➕ dazu rechnen</button><button data-op="-">➖ abziehen</button></div>
        <div class="brow"><span id="kLab">Ich rechne dazu:</span><button class="fld on" data-f="k">?</button></div>
        <div class="brow"><span>Das Ergebnis ist:</span><button class="fld" data-f="r">?</button></div>
      </div></div><div class="inp">${padHtml()}</div>`;
    const flds = {k:body.querySelector('[data-f="k"]'), r:body.querySelector('[data-f="r"]')};
    const paint = () => { for(const f of ['k', 'r']){ flds[f].textContent = vals[f] || '?'; flds[f].classList.toggle('on', f === field); } };
    await new Promise(res => {
      const key = k => {
        if(k === 'del'){ vals[field] = vals[field].slice(0, -1); }
        else if(k === 'ok'){
          if(!vals[field]){ bounce(flds[field], 'nudge'); return; }
          if(field === 'k' && !vals.r){ field = 'r'; }
          else if(vals.k && vals.r){ keyHandler = null; res(); return; }
          else field = vals.k ? 'r' : 'k';
        } else if(vals[field].length < 3){ vals[field] = (vals[field] === '0' ? '' : vals[field]) + k; }
        sfx.tap(); paint();
      };
      keyHandler = key;
      body.onclick = e => {
        const b = e.target.closest('[data-k]'); if(b){ key(b.dataset.k); return; }
        const o = e.target.closest('[data-op]');
        if(o){ op = o.dataset.op; body.querySelectorAll('[data-op]').forEach(x => x.classList.toggle('on', x === o));
          $('#kLab').textContent = op === '+' ? 'Ich rechne dazu:' : 'Ich ziehe ab:'; sfx.tap(); return; }
        const f = e.target.closest('[data-f]'); if(f){ field = f.dataset.f; sfx.tap(); paint(); }
      };
    });
    body.onclick = null; s.check();
    const k = +vals.k, r = +vals.r, sym = op === '+' ? '+' : '−';
    const secret = op === '+' ? r - k : r + k;
    body.querySelector('.inp').innerHTML = '';
    const bub = body.querySelector('.bub');
    bub.innerHTML = 'Hmm … lass mich überlegen … 🤔';
    await s.wait(1400);
    let ok = true;
    if(op === '+' && r < k){ ok = false; bub.innerHTML = `Moment! Wenn du <b>${k}</b> dazu rechnest, kann nicht <b>${r}</b> herauskommen – das Ergebnis muss größer sein. Prüf nochmal! 🧐`; }
    else if(secret > 100){ ok = false; bub.innerHTML = `Puh, dann wäre deine Zahl größer als 100 (${secret})! Probier ein kleineres Rätsel. 😅`; }
    if(!ok){
      body.querySelector('.inp').innerHTML = `<div class="next"><button class="btn big">Nochmal ➜</button></div>`;
      await new Promise(res => { body.querySelector('.inp button').onclick = res; }); s.check(); continue;
    }
    sfx.ok();
    bub.innerHTML = `Ich hab's! Deine geheime Zahl ist die <b>${secret}</b>! Denn ${secret} ${sym} ${k} = ${r}. Stimmt's?`;
    body.querySelector('.inp').innerHTML = `<div class="bin"><button class="b-ok" data-c="y"><span>🎉</span>Stimmt!</button><button class="b-lie" data-c="n"><span>🙈</span>Nein …</button></div>`;
    const c = await new Promise(res => { body.querySelector('.bin').onclick = e => { const b = e.target.closest('[data-c]'); if(b) res(b.dataset.c); }; });
    s.check();
    if(c === 'y'){ record('raetsel', true, `Rätsel: ? ${sym} ${k} = ${r}`, secret, secret); praise('Toll gerätselt!'); confetti(30);
      bub.innerHTML = `Juhu! Das war ein tolles Rätsel. Du bekommst einen Stern! ⭐`; }
    else bub.innerHTML = `Hmm, rechne nochmal nach: ${r} ${op === '+' ? '−' : '+'} ${k} = ${secret}. Hast du dich vielleicht verrechnet? Das passiert auch Profis! 😊`;
    body.querySelector('.inp').innerHTML = `<div class="next" style="flex-direction:column;align-items:center;gap:12px"><button class="btn big" data-more>Noch ein Rätsel</button><button class="btn big ghost" data-done>Fertig</button></div>`;
    const more = await new Promise(res => { body.querySelector('.inp').onclick = e => {
      if(e.target.closest('[data-more]')) res(true); else if(e.target.closest('[data-done]')) res(false); }; });
    s.check(); sfx.tap();
    if(!more){ s.playing = false; openIntro('raetsel'); return; }
  }
}

/* ---------- Spiel 7 & 8: Wettrennen ---------- */
function makePlayers(mode, start){
  return [{name:kidName(), av:state.profile.avatar, human:true, v:start},
    mode === 'duo' ? {name:'Mitspieler', av:'🧑', human:true, v:start} : {name:'Fuchs', av:'🦊', human:false, v:start}];
}
async function runRace(s, g, level, mode){
  const cards = g.id === 'karten';
  const start = cards ? 0 : (level === 1 ? 30 : 100), target = cards ? (level === 1 ? 50 : 100) : (level === 1 ? 10 : 50);
  const nDice = !cards && level === 3 ? 2 : 1;
  const P = makePlayers(mode, start);
  const body = frame(g, s); body.classList.add('race');
  const pct = v => Math.max(0, Math.min(100, cards ? v / target * 100 : (start - v) / (start - target) * 100));
  body.innerHTML = `<div class="lanes">${P.map((p, i) => `<div class="lane" data-p="${i}"><div class="lt"><span>${p.av} ${esc(p.name)}</span><span class="lv">${p.v}</span></div>
      <div class="track"><i style="width:0%"></i><span class="tok" style="left:0%">${p.av}</span><span class="fin">🏁</span></div></div>`).join('')}</div>
    <div class="stage"><div class="turn"></div><div class="play"></div><div class="eqw"></div></div><div class="inp"></div>`;
  const stageEl = body.querySelector('.stage'), lanes = body.querySelectorAll('.lane'), turnEl = body.querySelector('.turn'), play = body.querySelector('.play'), eqw = body.querySelector('.eqw'), inp = body.querySelector('.inp');
  const paint = () => P.forEach((p, i) => { const L = lanes[i]; L.querySelector('.lv').textContent = p.v;
    L.querySelector('.track i').style.width = pct(p.v) + '%'; L.querySelector('.tok').style.left = pct(p.v) + '%'; });
  paint();
  let turn = 0, winner = null;
  while(!winner){
    const p = P[turn];
    lanes.forEach((L, i) => L.classList.toggle('act', i === turn));
    eqw.innerHTML = ''; inp.innerHTML = ''; stageEl.classList.remove('asking');
    if(cards){
      play.innerHTML = `<div class="deckrow"><button class="deck ${p.human ? 'wiggle' : ''}" aria-label="Karte ziehen">🦊</button></div>`;
      turnEl.textContent = p.human ? `${p.name === 'Du' ? 'Du bist' : p.name + ' ist'} dran – tippe auf die Karten!` : 'Der Fuchs ist dran …';
    } else {
      play.innerHTML = `<div class="dice">${Array.from({length:nDice}, () => `<button class="die ${p.human ? 'wiggle' : ''}" aria-label="Würfeln">${dieFace(6)}</button>`).join('')}</div>`;
      turnEl.textContent = p.human ? `${p.name === 'Du' ? 'Du bist' : p.name + ' ist'} dran – tippe zum Würfeln!` : 'Der Fuchs würfelt …';
    }
    if(p.human) await waitTap(s, play); else await s.wait(900);
    let add, sub = '';
    if(cards){
      add = level === 3 ? rnd(3, 19) : rnd(1, 10); sfx.flip();
      play.querySelector('.deckrow').innerHTML += `<div class="pcard" data-n="${add}">${add}</div>`;
      play.querySelector('.deck').classList.remove('wiggle');
    } else {
      const dEls = [...play.querySelectorAll('.die')]; dEls.forEach(d => d.classList.remove('wiggle'));
      const vals = await rollDice(s, dEls);
      add = vals.reduce((a, b) => a + b, 0);
      if(nDice === 2) sub = `<div class="sumtxt">${vals[0]} + ${vals[1]} = ${add}</div>`;
    }
    await s.wait(500);
    const nv = cards ? p.v + add : p.v - add, sym = cards ? '+' : '−';
    stageEl.classList.add('asking');
    eqw.innerHTML = `${sub}<div class="eq"><span>${p.v}</span><span class="op">${sym}</span><span>${add}</span><span class="op">=</span><span class="slot">?</span></div>`;
    const slot = eqw.querySelector('.slot');
    if(p.human){
      turnEl.textContent = p.name === 'Du' ? 'Rechne aus: Was ist deine neue Zahl?' : `${p.name}, was ist deine neue Zahl?`;
      const help = cards ? plusHelp(p.v, add) : minusHelp(p.v, add);
      const r = await ask(s, inp, {answer:nv, slot, hint:help.hint, explain:help.explain});
      if(p === P[0]) record(g.id, r.ok, `${p.v} ${sym} ${add}`, r.first, nv);  // Sterne nur für das Kind
    } else {
      turnEl.textContent = 'Der Fuchs rechnet … 🤔';
      await s.wait(1100); slot.textContent = nv; slot.classList.add('ok'); sfx.ok(); await s.wait(900);
    }
    p.v = nv; paint(); await s.wait(700);
    if(cards ? p.v >= target : p.v <= target) winner = p;
    turn = 1 - turn;
  }
  const st = state.games[g.id]; st.rounds++;
  const kidWon = winner === P[0];
  if(kidWon) st.wins++;
  save();
  await s.wait(300);
  endScreen(s, g, {big: winner.human ? '🏆' : '🦊', win: winner.human,
    title: mode === 'duo' ? `${esc(winner.name)} gewinnt!` : kidWon ? 'Du hast gewonnen!' : 'Der Fuchs war schneller!',
    text: `${esc(winner.name)} ist zuerst bei ${target} angekommen.${!winner.human ? ' Nächstes Mal schaffst du es! 💪' : ''}`,
    again: () => startGame(g.id, level, mode)});
}
async function rollDice(s, dEls){
  sfx.flip();
  dEls.forEach(d => bounce(d, 'roll'));
  for(let i = 0; i < 7; i++){ dEls.forEach(d => d.innerHTML = dieFace(rnd(1, 6))); await s.wait(80); }
  const vals = dEls.map(d => { const v = rnd(1, 6); d.innerHTML = dieFace(v); return v; });
  sfx.tap();
  return vals;
}

/* ---------- Spiel 9: Süßes oder Rechnen ---------- */
const BOARD_N = 20, PUMP = new Set([2, 4, 6, 8, 11, 13, 15, 17, 19]), BAT = new Set([5, 10]);
function cellPos(i){
  if(i <= 6) return [0, i];
  if(i <= 10) return [i - 6, 6];
  if(i <= 16) return [4, 6 - (i - 10)];
  return [4 - (i - 16), 0];
}
function kTask(level){
  let a, b;
  if(level === 1){ a = rnd(2, 15); b = rnd(2, 20 - a); }
  else if(level === 2){ if(Math.random() < .5){ a = rnd(11, 89); b = rnd(2, 9); if(a + b > 100) a = 100 - b; } else { a = rnd(11, 79); b = rnd(1, Math.floor((100 - a) / 10)) * 10; } }
  else { a = rnd(15, 64); b = rnd(12, 99 - a); }
  return {a, b, ans:a + b};
}
async function runKuerbis(s, g, level, mode){
  const P = makePlayers(mode, 0).map(p => Object.assign(p, {pos:0, sw:0}));
  const body = frame(g, s); body.classList.add('kbody');
  let cells = '';
  for(let i = 0; i < BOARD_N; i++){
    const [r, c] = cellPos(i), cls = i === 0 ? 'start' : PUMP.has(i) ? 'pump' : BAT.has(i) ? 'bat' : '';
    cells += `<div class="cell ${cls}" data-i="${i}" style="grid-row:${r + 1};grid-column:${c + 1}"><span class="fe">${i === 0 ? 'START' : PUMP.has(i) ? '🎃' : BAT.has(i) ? '🦇' : ''}</span><span class="tks"></span></div>`;
  }
  body.innerHTML = `<div class="board">${cells}<div class="center"><div class="swt">${P.map((p, i) => `<div class="swr" data-p="${i}">${p.av}${SWEETS.map(x => `<span class="sl">${x}</span>`).join('')}</div>`).join('')}</div>
      <button class="die" aria-label="Würfeln">${dieFace(5)}</button></div></div>
    <div class="kpanel"><div class="turn"></div><div class="kmsg"></div></div><div class="sheet" hidden></div>`;
  const dieEl = body.querySelector('.center .die'), turnEl = body.querySelector('.turn'), msg = body.querySelector('.kmsg'), sheet = body.querySelector('.sheet');
  const rows = body.querySelectorAll('.swr');
  const paintTokens = () => {
    body.querySelectorAll('.cell').forEach(c => { c.querySelector('.tks').innerHTML = ''; c.classList.remove('has'); });
    P.forEach(p => { const c = body.querySelector(`.cell[data-i="${p.pos}"]`); c.classList.add('has'); c.querySelector('.tks').innerHTML += `<span class="tk">${p.av}</span>`; });
  };
  const paintSweets = () => P.forEach((p, i) => rows[i].querySelectorAll('.sl').forEach((x, k) => x.classList.toggle('got', k < p.sw)));
  paintTokens(); paintSweets();
  let turn = 0, winner = null;
  while(!winner){
    const p = P[turn];
    rows.forEach((r, i) => r.classList.toggle('act', i === turn));
    turnEl.textContent = p.human ? `${p.name === 'Du' ? 'Du bist' : p.name + ' ist'} dran – tippe auf den Würfel!` : 'Der Fuchs würfelt …';
    dieEl.classList.toggle('wiggle', p.human);
    if(p.human) await waitTap(s, dieEl); else await s.wait(900);
    dieEl.classList.remove('wiggle'); msg.textContent = '';
    const [d] = await rollDice(s, [dieEl]);
    await s.wait(350);
    for(let k = 0; k < d; k++){ p.pos = (p.pos + 1) % BOARD_N; paintTokens(); sfx.step(); await s.wait(260); }
    if(BAT.has(p.pos)){ msg.textContent = '🦇 Fledermaus! Nochmal würfeln!'; await s.wait(1200); continue; }
    if(PUMP.has(p.pos)){
      const t = kTask(level);
      sheet.hidden = false;
      const vis = level === 3
        ? `<div class="kwrap"><div class="schr"><div>${t.a}</div><div>+ ${t.b}</div><div class="ln"></div><div><span class="slot">?</span></div></div></div>`
        : `<div class="eq"><span>${t.a}</span><span class="op">+</span><span>${t.b}</span><span class="op">=</span><span class="slot">?</span></div>`;
      sheet.innerHTML = `<div class="kt">🎃 Kürbiskarte für ${p.av} ${esc(p.name)}</div>${vis}<div class="inp"></div>`;
      sfx.flip();
      const slot = sheet.querySelector('.slot');
      let got;
      if(p.human){
        const help = plusHelp(t.a, t.b);
        const r = await ask(s, sheet.querySelector('.inp'), {answer:t.ans, slot, hint:help.hint, explain:help.explain});
        if(p === P[0]) record(g.id, r.ok, `${t.a} + ${t.b}`, r.first, t.ans); got = r.ok;  // Sterne nur für das Kind
      } else {
        sheet.querySelector('.inp').innerHTML = `<div class="kmsg">Der Fuchs rechnet … 🤔</div>`;
        await s.wait(1300);
        got = Math.random() < .82;
        const fa = got ? t.ans : t.ans + pick([1, -1, 10]);
        slot.textContent = fa;
        if(got){ slot.classList.add('ok'); sfx.ok(); sheet.querySelector('.inp').innerHTML = `<div class="kmsg">Richtig gerechnet! 🦊</div>`; }
        else { bounce(slot, 'bad'); sfx.bad(); sheet.querySelector('.inp').innerHTML = `<div class="kmsg">Der Fuchs hat sich verrechnet! 🙈 Richtig ist ${t.ans}. Kein Süßes für ihn!</div>`; }
        await s.wait(1700);
      }
      sheet.hidden = true; sheet.innerHTML = '';
      if(got){ p.sw++; paintSweets(); sfx.sticker(); msg.textContent = `${p.av} bekommt ${SWEETS[p.sw - 1]}!`; await s.wait(900); }
      if(p.sw >= SWEETS.length) winner = p;
    } else {
      msg.textContent = p.pos === 0 ? 'Eine Runde geschafft! 🏁' : '';
      await s.wait(500);
    }
    turn = 1 - turn;
  }
  const st = state.games[g.id]; st.rounds++; if(winner === P[0]) st.wins++; save();
  await s.wait(300);
  endScreen(s, g, {big: winner.human ? '🍭' : '🦊', win: winner.human,
    title: mode === 'duo' ? `${esc(winner.name)} gewinnt!` : winner === P[0] ? 'Alle Süßigkeiten gesammelt!' : 'Der Fuchs hat alles gesammelt!',
    text: winner === P[0] || mode === 'duo' ? 'Süßes oder Rechnen – du kannst beides! 🎃' : 'Knapp! Beim nächsten Mal holst du dir alle Süßigkeiten. 💪',
    again: () => startGame(g.id, level, mode)});
}
