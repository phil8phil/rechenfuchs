<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rechenfuchs">
<meta name="theme-color" content="#FFF7EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17132A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Rechenfuchs – 9 Mathe-Spiele für die 2. Klasse. Rechnen bis 100 ohne Finger.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Rechenfuchs</title>
<style>
:root{
  --bg:#FFF7EC; --bg2:#FFEEDA; --card:#FFFFFF; --ink:#2B2140; --muted:#7A6F8A; --line:#EADCC8;
  --fox:#FF7A1A; --fox2:#FFB347; --ok:#1FAF6A; --bad:#EF476F; --lie:#8B5CF6;
  --shadow:0 5px 0 rgba(43,33,64,.07), 0 10px 22px rgba(43,33,64,.07);
  --ga:#FF7A1A;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17132A; --bg2:#1F1938; --card:#272044; --ink:#F6F1FF; --muted:#A99FC2; --line:#3A3262;
    --shadow:0 5px 0 rgba(0,0,0,.25), 0 10px 22px rgba(0,0,0,.28); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:disabled{opacity:.35;cursor:default}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

/* ---------- Shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(var(--st) + 10px) max(16px,var(--sr)) 10px max(16px,var(--sl));
  background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .bf{font-size:26px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:800;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
#view{flex:1;width:100%;max-width:980px;margin:0 auto;padding:4px max(16px,var(--sr)) calc(100px + var(--sb)) max(16px,var(--sl))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;gap:6px;
  padding:8px 12px calc(8px + var(--sb));background:color-mix(in srgb,var(--card) 90%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px;border-radius:14px;font-size:12px;font-weight:800;color:var(--muted)}
.tab .ti{font-size:25px;filter:grayscale(.7);opacity:.7;transition:transform .2s}
.tab[aria-current="true"]{color:var(--fox)}
.tab[aria-current="true"] .ti{filter:none;opacity:1;transform:scale(1.12)}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.sec{font-size:15px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 10px}
.small{font-size:13px;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:18px;
  background:var(--ga);color:#fff;font-weight:800;font-size:18px;box-shadow:0 5px 0 color-mix(in srgb,var(--ga) 62%,#000);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.btn.big{min-height:62px;font-size:21px;width:100%;max-width:420px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.danger{--ga:#D9364F}
.btn.sm{min-height:42px;font-size:16px;padding:8px 14px;border-radius:14px}

/* ---------- Home ---------- */
.install{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--fox) 14%,var(--card));border:2px solid color-mix(in srgb,var(--fox) 35%,transparent);
  border-radius:20px;padding:12px 14px;margin:6px 0 12px;font-size:15px;font-weight:600;line-height:1.4}
.install .ii{font-size:26px}
.install b{font-weight:800}
.install svg{width:17px;height:17px;vertical-align:-3px;color:#2F7BF6}
.install .ix{margin-left:auto;font-size:18px;font-weight:800;color:var(--muted);width:32px;height:32px;flex:none}
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.hero .av{width:64px;height:64px;flex:none;border-radius:22px;background:var(--card);display:grid;place-items:center;font-size:40px;box-shadow:var(--shadow)}
.hello{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hello-sub{font-size:16px;color:var(--muted);font-weight:600;margin-top:3px}
.goal .gr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.bar{height:14px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--fox2),var(--fox));transition:width .6s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gcard{position:relative;overflow:hidden;min-height:156px;border-radius:24px;padding:14px;color:#fff;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c) 70%);
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 62%,#000);transition:transform .1s}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 62%,#000)}
.gcard .ge{font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.gcard .gt{font-size:18px;font-weight:800;line-height:1.15}
.gcard .gs{font-size:13px;font-weight:600;opacity:.92;line-height:1.25;margin-top:2px}
.gcard .gn{position:absolute;right:-6px;bottom:-26px;font-size:110px;font-weight:900;opacity:.14;line-height:1}
.gcard .glv{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.26);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800}

/* ---------- Stickers ---------- */
.shead{text-align:center;padding:10px 0 4px}
.shead .big{font-size:46px;font-weight:900;letter-spacing:-.02em}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px;margin-top:16px}
.stk{aspect-ratio:1;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:44px}
.stk.lock{background:var(--bg2);box-shadow:none;font-size:22px;color:var(--muted);font-weight:800;border:2px dashed var(--line)}

/* ---------- Eltern ---------- */
.el h3{font-size:18px;font-weight:800;margin-bottom:10px}
.el .card{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-weight:700;font-size:14px;color:var(--muted)}
.field input{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:700;outline:none}
.field input:focus{border-color:var(--fox)}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{width:48px;height:48px;border-radius:14px;background:var(--bg);font-size:28px;border:2px solid transparent}
.avs button.on{border-color:var(--fox);background:color-mix(in srgb,var(--fox) 14%,var(--card))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .rl{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}
.row .rl span:first-child{font-size:24px}
.chips{display:flex;gap:6px;flex:none}
.chips button{min-width:40px;height:36px;border-radius:11px;background:var(--bg);font-weight:800;border:2px solid var(--line)}
.chips button.on{background:var(--fox);color:#fff;border-color:var(--fox)}
.stat{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:12px;font-weight:700;color:var(--muted)}
.week i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--fox);min-height:3px}
.week b{color:var(--ink);font-size:12px}
.mist{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.mist:first-child{border-top:0}
.mist .mt{font-weight:800;font-variant-numeric:tabular-nums}
.mist .mg{color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.gate{text-align:center;padding:30px 10px}
.gate .gi{font-size:56px}
.gate input{text-align:center;max-width:160px;margin:14px auto}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.switch{width:56px;height:34px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(22px)}

/* ---------- Game layer ---------- */
#game{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:var(--st) var(--sr) var(--sb) var(--sl);overflow:hidden}
#game::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--ga) 20%,transparent),transparent 70%)}
.g-head{position:relative;display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.g-x{width:46px;height:46px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:900;flex:none}
.g-title{flex:1;text-align:center;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-stars{flex:none;min-width:46px}
.g-stars.bump{animation:bump .45s}
.dots{position:relative;display:flex;justify-content:center;gap:7px;padding:6px 0 4px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i.cur{background:var(--ga);transform:scale(1.25)}
.dots i.p{background:var(--ok)}
.dots i.o{background:var(--fox2)}
.dots i.x{background:var(--bad)}
.g-body{position:relative;flex:1;min-height:0;width:100%;max-width:580px;margin:0 auto;padding:0 16px 12px;display:flex;flex-direction:column}
.task{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:6px 0}
.inp{flex:none}

.say{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.say .fx{font-size:46px;line-height:1;flex:none;animation:bob 2.6s ease-in-out infinite}
.say .bub{background:var(--card);border-radius:22px 22px 22px 6px;padding:12px 16px;font-size:clamp(17px,4.6vw,21px);font-weight:650;line-height:1.38;box-shadow:var(--shadow);text-align:left}
.say .bub b{color:var(--ga);font-weight:900}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-size:clamp(36px,11vw,58px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eq .op{color:var(--muted);font-weight:800}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:1.8em;padding:2px 12px;border-radius:18px;background:var(--card);
  border:3px dashed color-mix(in srgb,var(--ga) 65%,transparent);color:var(--ga);font-variant-numeric:tabular-nums;line-height:1.2}
.slot.filled{border-style:solid}
.slot.ok{border:3px solid var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));animation:pop .4s}
.slot.bad{border-color:var(--bad);color:var(--bad);animation:shake .42s}
.slot.reveal{border:3px solid var(--fox2);color:var(--ink);background:color-mix(in srgb,var(--fox2) 25%,var(--card))}
.slot.nudge{animation:shake .3s}

.hint{display:flex;gap:10px;align-items:flex-start;max-width:440px;margin:0 auto 10px;padding:10px 14px;border-radius:18px;
  background:color-mix(in srgb,var(--fox2) 24%,var(--card));font-size:16px;font-weight:650;line-height:1.4;text-align:left;animation:rise .3s}
.hint.sol{background:color-mix(in srgb,var(--ga) 16%,var(--card))}
.hint .hi{font-size:22px;line-height:1}
.hint b{font-weight:900}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.pad button{height:clamp(50px,8.4vh,76px);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--line);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;transition:transform .06s}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.pad .ok{background:var(--ga);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.pad .ok:active{box-shadow:0 1px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.pad .del{font-size:24px;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto;width:100%}
.choices button{height:clamp(50px,7.6vh,68px);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--line);font-size:28px;font-weight:800;position:relative}
.choices button::after{content:"♥";position:absolute;top:3px;right:8px;font-size:12px;color:var(--ga);opacity:.55}
.choices button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.next{display:flex;justify-content:center;padding-top:6px}
.praise{position:absolute;left:50%;top:calc(var(--st) + 70px);transform:translateX(-50%);z-index:3;pointer-events:none;
  font-size:30px;font-weight:900;color:var(--ok);white-space:nowrap;opacity:0;text-shadow:0 2px 0 var(--card)}
.praise.show{animation:praise 1.1s ease-out}

/* visual helpers */
.tf{display:grid;grid-template-columns:repeat(5,22px);gap:5px;padding:8px;border-radius:12px;background:var(--card);margin-top:8px;width:max-content}
.tf i{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);opacity:.5}
.tf i.on{background:var(--ga);border-color:var(--ga);opacity:1}
.dr{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.dr i{width:18px;height:18px;border-radius:50%;background:var(--ga)}
.dr.b i{background:var(--lie)}
.nl{width:100%;max-width:320px;height:auto;margin-top:6px;display:block}
.hausnr{display:inline-flex;flex-direction:column;align-items:center}
.hausnr .hh{font-size:64px;line-height:1}
.hausnr .hs{margin-top:-6px;background:#1D4FA3;color:#fff;border:4px solid #fff;outline:3px solid #1D4FA3;border-radius:12px;padding:2px 18px;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border:3px solid #111;border-radius:10px;overflow:hidden;font-family:"DIN Alternate","Arial Narrow",var(--font);box-shadow:var(--shadow)}
.plate .eu{background:#1D4FA3;color:#FFD400;width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;font-size:15px;font-weight:800}
.plate .eu::before{content:"★";font-size:12px;margin-bottom:auto;margin-top:5px}
.plate .pt{padding:6px 16px;font-size:40px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.chain .cb{min-width:62px;height:62px;padding:0 8px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.chain .cb.first{opacity:.55}
.chain .ca{font-size:15px;font-weight:900;color:var(--ga);display:flex;flex-direction:column;align-items:center;line-height:1}
.chain .slot{font-size:28px;min-width:72px;height:62px;border-radius:31px}
.machine{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(30px,9vw,46px);font-weight:900;flex-wrap:wrap}
.machine .mop{background:var(--ga);color:#fff;border-radius:16px;padding:4px 14px;box-shadow:0 4px 0 color-mix(in srgb,var(--ga) 62%,#000)}
.machine .arr{color:var(--muted);font-size:.7em}
.tafel{background:#2E5E4E;color:#F4F1E6;border:8px solid #9A6B3F;border-radius:14px;padding:18px 22px;font-size:clamp(34px,10vw,52px);font-weight:800;
  font-variant-numeric:tabular-nums;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.tafel .shown{transition:all .3s}
.tafel .shown.strike{text-decoration:line-through;text-decoration-thickness:5px;text-decoration-color:var(--bad);opacity:.7}
.tafel .shown.good{color:#7CF2B3}
.tafel .slot{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.6)}
.tafel .slot.ok{color:#7CF2B3;border-color:#7CF2B3;background:rgba(124,242,179,.15)}
.bin{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;margin:0 auto;width:100%}
.bin button{min-height:96px;border-radius:22px;font-size:22px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bin button span{font-size:36px}
.bin .b-ok{background:var(--ok);box-shadow:0 6px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.bin .b-lie{background:var(--lie);box-shadow:0 6px 0 color-mix(in srgb,var(--lie) 60%,#000)}
.bin button:active{transform:translateY(5px);box-shadow:none}

/* intro / end */
.g-body.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.intro{align-items:center;text-align:center;gap:14px}
.ibig{font-size:84px;line-height:1;margin-top:6px;animation:bob 2.6s ease-in-out infinite}
.intro h1,.end h1{font-size:30px;font-weight:900;letter-spacing:-.02em}
.lvh{font-weight:800;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
.lvls button{background:var(--card);border-radius:18px;padding:10px 6px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.lvls button b{font-size:14px;letter-spacing:-2px}
.lvls button span{font-weight:900;font-size:15px}
.lvls button small{font-size:12px;color:var(--muted);font-weight:650;line-height:1.25}
.lvls button.on{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 12%,var(--card))}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:440px}
.modes button{background:var(--card);border-radius:16px;padding:12px 8px;font-weight:800;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.modes button.on{border-color:var(--ga);background:color-mix(in srgb,var(--ga) 12%,var(--card))}
.tip{font-size:14px;color:var(--muted);font-weight:600;line-height:1.45;max-width:440px;background:var(--bg2);border-radius:16px;padding:10px 14px;text-align:left}
.end{align-items:center;justify-content:center;text-align:center;gap:14px}
.ebig{font-size:96px;line-height:1;animation:pop .6s}
.end p{font-size:18px;font-weight:650;color:var(--muted);max-width:380px;line-height:1.4}
.estars{font-size:34px;font-weight:900;color:var(--fox)}
.lvup{background:color-mix(in srgb,var(--ok) 15%,var(--card));color:var(--ok);font-weight:800;border-radius:16px;padding:10px 14px}

/* race games */
.lanes{display:flex;flex-direction:column;gap:12px;margin:6px 0 4px}
.lane{background:var(--card);border-radius:18px;padding:10px 14px 14px;box-shadow:var(--shadow);border:3px solid transparent;transition:border-color .2s}

.track{position:relative;height:14px;border-radius:99px;background:var(--bg2)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ga);transition:width .6s}
.track .tok{position:absolute;top:50%;font-size:28px;transform:translate(-50%,-56%);transition:left .6s;line-height:1}
.track .fin{position:absolute;right:-4px;top:50%;transform:translateY(-55%);font-size:20px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.turn{font-weight:800;font-size:18px;min-height:26px}
.deckrow{display:flex;align-items:center;justify-content:center;gap:18px}
.deck{width:96px;height:134px;border-radius:16px;background:repeating-linear-gradient(45deg,var(--ga) 0 10px,color-mix(in srgb,var(--ga) 80%,#fff) 10px 20px);
  border:5px solid #fff;box-shadow:4px 4px 0 color-mix(in srgb,var(--ga) 60%,#000),8px 8px 0 color-mix(in srgb,var(--ga) 35%,#000);

.deck.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.pcard{width:96px;height:134px;border-radius:16px;background:#fff;color:#2B2140;border:3px solid var(--line);box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:56px;font-weight:900;animation:flip .45s ease-out;position:relative}
.pcard::before,.pcard::after{content:attr(data-n);position:absolute;font-size:15px;font-weight:900;color:var(--ga)}
.pcard::before{top:6px;left:9px}.pcard::after{bottom:6px;right:9px;transform:rotate(180deg)}
.dice{display:flex;gap:16px;justify-content:center}
.die{width:92px;height:92px;border-radius:22px;background:#fff;box-shadow:0 6px 0 #D8CDBB,0 10px 20px rgba(0,0,0,.12);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13px;gap:2px}
.die i{width:16px;height:16px;border-radius:50%;place-self:center;background:transparent}
.die i.on{background:#2B2140}
.die.roll{animation:roll .6s ease-out}
.die.wiggle{animation:wiggle 1.4s ease-in-out infinite}
.sumtxt{font-weight:800;color:var(--muted)}

/* pumpkin board */
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(5,1fr);gap:4px;width:min(100%,calc((100dvh - 330px) * 7 / 5));aspect-ratio:7/5;margin:4px auto 0;
  background:color-mix(in srgb,#2F7A3A 18%,var(--card));border-radius:20px;padding:6px;box-shadow:var(--shadow)}
.cell{position:relative;border-radius:10px;background:color-mix(in srgb,#8B5A2B 22%,var(--card));display:grid;place-items:center;font-size:clamp(14px,4.2vw,26px);line-height:1}
.cell.pump{background:color-mix(in srgb,#FF7A1A 30%,var(--card))}
.cell.bat{background:color-mix(in srgb,#5B3DAE 30%,var(--card))}
.cell.start{background:color-mix(in srgb,#1FAF6A 30%,var(--card));font-size:clamp(10px,2.6vw,14px);font-weight:900}
.cell .tks{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:0}
.cell .tk{font-size:clamp(16px,4.6vw,28px);filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));animation:hop .22s}
.cell.has .fe{opacity:.25}
.center{grid-row:2/5;grid-column:2/7;display:flex;align-items:center;justify-content:space-around;gap:6px;padding:4px}
.swt{display:flex;flex-direction:column;gap:6px}
.swr{display:flex;align-items:center;gap:3px;font-size:clamp(13px,3.6vw,20px);background:var(--card);border-radius:12px;padding:3px 6px;border:2px solid transparent}

.kbody{justify-content:center}
.kpanel{text-align:center;padding:12px 0 4px}
.kmsg{font-weight:700;color:var(--muted);font-size:15px;min-height:22px;margin-top:4px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-radius:28px 28px 0 0;padding:16px 16px 12px;box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:sheet .3s ease-out;max-height:100%;overflow:auto}

/* builder (Rätsel stellen) */
.builder{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;font-size:19px;font-weight:750}

/* modal / toast / confetti */
.mbg{position:fixed;inset:0;z-index:60;background:rgba(18,12,38,.5);display:grid;place-items:center;padding:24px;animation:fade .2s}
.modal{background:var(--card);border-radius:28px;padding:24px 20px 20px;width:100%;max-width:360px;text-align:center;animation:pop .32s;box-shadow:0 20px 50px rgba(0,0,0,.3)}

  font-weight:800;padding:12px 18px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .3s;max-width:90vw;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;animation:fall linear forwards}


/* ---------- Reise zum Schloss ---------- */
.goals{display:grid;gap:14px}
.jmini{display:block;width:100%;text-align:left}
.jmini .gr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.jtrack{position:relative;height:14px;border-radius:99px;background:var(--bg2);margin:20px 34px 12px 6px}
.jtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C084FC,#8B5CF6);transition:width .6s}
.jtrack .jt{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--line);border:2px solid var(--card);transform:translate(-50%,-50%)}

.jnext b{font-weight:900}
.mapwrap{max-width:560px;margin:14px auto 0;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}

#jmap .ob.done .chk{opacity:1}
#jmap .ob .ringd{opacity:0;transition:opacity .4s}
#jmap .ob.done .ringd{opacity:1}
#jmap .ob .aft{opacity:0;transition:opacity .6s}
#jmap .ob.done .aft{opacity:1}

.hbob{animation:hbob 1.4s ease-in-out infinite}

.mapsel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}

.trow{display:flex;flex-wrap:wrap;gap:10px;font-size:34px}

.trophy{font-weight:800;margin:0 0 14px;display:flex;align-items:center;justify-content:center;gap:8px}

.herosel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.herosel button{background:var(--bg);border:3px solid transparent;border-radius:18px;padding:10px 6px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
.herosel button span{font-size:44px;line-height:1.1}

.jline{font-weight:800;background:color-mix(in srgb,#8B5CF6 14%,var(--card));color:#8B5CF6;border-radius:16px;padding:10px 14px}
.modal{max-height:calc(100dvh - 40px);overflow-y:auto}
.chips button{padding:0 9px}
.row.wrap{flex-wrap:wrap;row-gap:8px}

.row.wrap .chips{margin-left:34px}
@keyframes hbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes twk{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media (min-width:700px){ .goals{grid-template-columns:1fr 1fr} }


/* ---------- Spiel-Layout: nichts darf das Ergebnisfeld überdecken ---------- */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function normalize(raw){
  const d = defaults();
  if(!raw || typeof raw !== 'object') return d;
  const s = raw;
  // Migrationen künftiger Schema-Versionen hier ergänzen: if((s.schema||0) < 2) { ... }
  const out = Object.assign({}, d, s);
  out.schema = SCHEMA;
  out.profile = Object.assign({}, d.profile, s.profile || {});
  out.profile.name = String(out.profile.name || '').slice(0, 20);
  if(!AVATARS.includes(out.profile.avatar)) out.profile.avatar = '🐻';
  out.settings = Object.assign({}, d.settings, s.settings || {});
  out.settings.sound = out.settings.sound !== false;
  out.settings.dailyGoal = [10, 20, 30, 40].includes(+out.settings.dailyGoal) ? +out.settings.dailyGoal : 20;
  out.games = {};
  GAMES.forEach(g => {
    const m = Object.assign(defaultGame(), (s.games || {})[g.id] || {});
    m.level = Math.min(3, Math.max(1, parseInt(m.level, 10) || 1));
    ['rounds','correct','wrong','best','wins'].forEach(k => m[k] = Math.max(0, parseInt(m[k], 10) || 0));
    out.games[g.id] = m;
  });
  out.stars = Math.max(0, parseInt(s.stars, 10) || 0);
  out.stickers = Array.isArray(s.stickers) ? s.stickers.filter(x => STICKERS.includes(x)) : [];
  const should = Math.min(STICKERS.length, Math.floor(out.stars / STARS_PER_STICKER));
  for(const st of STICKERS){ if(out.stickers.length >= should) break; if(!out.stickers.includes(st)) out.stickers.push(st); }
  out.mistakes = Array.isArray(s.mistakes) ? s.mistakes.slice(0, 40) : [];
  out.days = (s.days && typeof s.days === 'object' && !Array.isArray(s.days)) ? Object.assign({}, s.days) : {};
  const keys = Object.keys(out.days).sort();
  keys.slice(0, Math.max(0, keys.length - 120)).forEach(k => delete out.days[k]);
  out.goalDays = Array.isArray(s.goalDays) ? s.goalDays.slice(-120) : [];
  // Schema 2: Reise zum Schloss. Bestehende Stände starten die Reise beim aktuellen Sternestand.
  const sj = s.journey && typeof s.journey === 'object' ? s.journey : null;
  out.journey = {
    hero: sj && ['king', 'queen'].includes(sj.hero) ? sj.hero : null,
    n: sj ? Math.max(0, parseInt(sj.n, 10) || 0) : 0,
    start: sj ? Math.max(0, parseInt(sj.start, 10) || 0) : out.stars,
    target: sj && [80, 120, 160, 200].includes(+sj.target) ? +sj.target : 120,
    seen: sj ? Math.max(0, parseInt(sj.seen, 10) || 0) : 0,
    trophies: sj && Array.isArray(sj.trophies) ? sj.trophies.filter(x => typeof x === 'string').slice(-200) : []
  };
  // Seit 1.4: Karte frei wählbar (vorher automatisch reihum über n)
  const mp = sj ? parseInt(sj.map, 10) : NaN;
  out.journey.map = mp >= 0 && mp < 4 ? mp : out.journey.n % 4;
  if(out.journey.start > out.stars) out.journey.start = out.stars;
  return out;
}

let actx = null;
function tone(freqs, dur = .12, type = 'sine', gain = .14){
  if(!state.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = t0 + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .012);
      g.gain.exponentialRampToValueAtTime(.0008, t + dur * 1.7);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur * 1.8);
    });
  } catch(e){}
}

function plusHelp(a, b){
  const s = a + b;
  if(b % 10 === 0) return {hint:`Nur die Zehner werden mehr: ${Math.floor(a / 10)} Zehner + ${b / 10} Zehner.`, explain:`${a} + ${b} = <b>${s}</b>`};
  if(b > 10){ const t = b - b % 10, o = b % 10;
    return {hint:`Erst die Zehner: ${a} + ${t} = ${a + t}. Dann noch + ${o}.`, explain:`${a} + ${t} = ${a + t}, dann ${a + t} + ${o} = <b>${s}</b>`}; }
  const toTen = (10 - a % 10) % 10;
  if(toTen > 0 && b > toTen) return {hint:`Erst bis zum Zehner: ${a} + ${toTen} = ${a + toTen}. Dann noch + ${b - toTen}.`,
    explain:`${a} + ${toTen} = ${a + toTen}, dann ${a + toTen} + ${b - toTen} = <b>${s}</b>`};
  if(a >= 10) return {hint:`Schau nur auf die Einer: ${a % 10} + ${b} = ${a % 10 + b}.`, explain:`${a} + ${b} = <b>${s}</b>`};
  return {hint:`Fang bei der größeren Zahl an und rechne im Kopf weiter.`, explain:`${a} + ${b} = <b>${s}</b>`};
}
function minusHelp(a, b){
  const d = a - b;
  if(b % 10 === 0) return {hint:`Nur die Zehner werden weniger: ${Math.floor(a / 10)} Zehner − ${b / 10} Zehner.`, explain:`${a} − ${b} = <b>${d}</b>`};
  if(b > 10){ const t = b - b % 10, o = b % 10;
    return {hint:`Erst die Zehner: ${a} − ${t} = ${a - t}. Dann noch − ${o}.`, explain:`${a} − ${t} = ${a - t}, dann ${a - t} − ${o} = <b>${d}</b>`}; }
  const ones = a % 10;
  if(ones > 0 && b > ones) return {hint:`Erst bis zum Zehner: ${a} − ${ones} = ${a - ones}. Dann noch − ${b - ones}.`,
    explain:`${a} − ${ones} = ${a - ones}, dann ${a - ones} − ${b - ones} = <b>${d}</b>`};
  if(ones === 0) return {hint:`Denk an die verliebten Zahlen: 10 − ${b} = ${10 - b}. Also ${a - 10} + ${10 - b}.`, explain:`${a} − ${b} = <b>${d}</b>`};
  return {hint:`Schau nur auf die Einer: ${ones} − ${b} = ${ones - b}.`, explain:`${a} − ${b} = <b>${d}</b>`};
}

/* ---------- Belohnungen & Statistik ---------- */
function record(gameId, ok, text, given, correct){
  const g = state.games[gameId];
  ok ? g.correct++ : g.wrong++;
  g.last = todayKey();
  const day = todayKey();
  state.days[day] = (state.days[day] || 0) + 1;
  let newSticker = null;
  if(ok){
    state.stars++;
    const should = Math.min(STICKERS.length, Math.floor(state.stars / STARS_PER_STICKER));
    if(state.stickers.length < should){
      newSticker = STICKERS.find(s => !state.stickers.includes(s));
      if(newSticker) state.stickers.push(newSticker);
    }
    if(cur){ cur.stars++; const b = layer.querySelector('.g-stars');
      if(b){ b.querySelector('b').textContent = cur.stars; b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); } }
  } else {
    state.mistakes.unshift({g:gameId, t:String(text), a:given == null ? '–' : String(given), c:String(correct), d:Date.now()});
    state.mistakes = state.mistakes.slice(0, 40);
  }
  let goalNow = false;
  if(state.days[day] >= state.settings.dailyGoal && !state.goalDays.includes(day)){ state.goalDays.push(day); goalNow = true; }
  save(); updateStarPill();
  if(newSticker) setTimeout(() => stickerPopup(newSticker), 700);
  else if(goalNow) setTimeout(() => toast('🏆 Tagesziel geschafft! Super gemacht!', 3000), 600);
}
function stickerPopup(st){
  sfx.sticker(); confetti(50);
  const m = modal(`<div class="mbig">${st}</div><h2>Neuer Sticker!</h2><p>Du hast ${state.stars} Sterne gesammelt. Der Sticker klebt jetzt in deinem Album.</p><div class="btnrow"><button class="btn">Juhu! 🎉</button></div>`);
  m.el.onclick = e => { if(e.target.closest('button') || e.target === m.el) m.close(); };
}

const jProg = () => Math.max(0, Math.min(state.journey.target, state.stars - state.journey.start));

function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Weg als weiche Kurve (Catmull-Rom -> Bezier), mit eigener Längenmessung */
function curve(th = jTheme()){
  if(CURVES[th.key]) return CURVES[th.key];
  const P = WAYS[th.key] || WAY; let d = `M${P[0][0]} ${P[0][1]}`; const sm = [];
  for(let i = 0; i < P.length - 1; i++){
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`;
    for(let k = i ? 1 : 0; k <= 40; k++){
      const t = k / 40, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, e = t * t * t;
      sm.push([a * p1[0] + b * c1[0] + c * c2[0] + e * p2[0], a * p1[1] + b * c1[1] + c * c2[1] + e * p2[1]]);
    }
  }
  const cum = [0];
  for(let i = 1; i < sm.length; i++) cum.push(cum[i - 1] + Math.hypot(sm[i][0] - sm[i - 1][0], sm[i][1] - sm[i - 1][1]));
  const L = cum[cum.length - 1];
  const at = f => {
    const t = Math.max(0, Math.min(1, f)) * L; let lo = 0, hi = cum.length - 1;
    while(hi - lo > 1){ const mid = (lo + hi) >> 1; if(cum[mid] < t) lo = mid; else hi = mid; }
    const seg = cum[hi] - cum[lo] || 1, r = (t - cum[lo]) / seg;
    return {x: sm[lo][0] + (sm[hi][0] - sm[lo][0]) * r, y: sm[lo][1] + (sm[hi][1] - sm[lo][1]) * r};
  };
  return CURVES[th.key] = {d, sm, L, at, start: {x: P[0][0], y: P[0][1]}};
}

const n1 = v => Math.round(v * 10) / 10;

const shadowE = (x, y, rx) => `<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="${n1(rx)}" ry="${n1(rx * .3)}" fill="#000" opacity=".14"/>`;

function flowerBed(cx, cy, w, th, rng, skip){

function mountainScene(p, sc, lava){
  const peak = (bx1, bx2, by, ax, ay) => {
    const k = .32, lx = ax + (bx1 - ax) * k, ly = ay + (by - ay) * k, rx = ax + (bx2 - ax) * k;
    return `<path d="M${n1(bx1)} ${n1(by)} L${n1(ax)} ${n1(ay)} L${n1(bx2)} ${n1(by)}Z" fill="${sc[0]}"/><path d="M${n1(ax)} ${n1(ay)} L${n1(bx2)} ${n1(by)} L${n1(ax + (bx2 - ax) * .12)} ${n1(by)}Z" fill="#000" opacity=".14"/>
      <path d="M${n1(lx)} ${n1(ly)} L${n1(ax)} ${n1(ay)} L${n1(rx)} ${n1(ly)} L${n1(rx - (rx - ax) * .4)} ${n1(ly - 4)} L${n1(ax + 1)} ${n1(ly + 3)} L${n1(lx + (ax - lx) * .45)} ${n1(ly - 3)}Z" fill="${sc[1]}"/>`;
  };
  let r = peak(p.x - 68, p.x + 14, p.y + 16, p.x - 27, p.y - 52) + peak(p.x - 8, p.x + 68, p.y + 18, p.x + 30, p.y - 30);
  if(lava) r += `<path d="M${n1(p.x - 30)} ${n1(p.y - 46)} q2 10 -4 20 M${n1(p.x - 24)} ${n1(p.y - 47)} q3 8 1 15" stroke="#FF6B2C" stroke-width="2.6" fill="none" stroke-linecap="round"/>` +
    [0, 1, 2].map(i => `<circle class="smoke${i ? ' s2' : ''}" cx="${n1(p.x - 27 + i * 3)}" cy="${n1(p.y - 60 - i * 5)}" r="${4 + i}" fill="#B8B4BE"/>`).join('');
  return r;
}

function mapSVG(th, H, arrived){
  const C = curve(th), rng = mulberry(th.key.length * 977 + th.key.charCodeAt(0));
  /* Startdorf folgt dem Wegbeginn */
  const S0 = C.start, sdir = S0.x < 120 ? 1 : S0.x > 240 ? -1 : 1;
  const hx = Math.max(26, Math.min(334, S0.x - 34 * sdir)), sx = Math.max(26, Math.min(334, S0.x + 44 * sdir)), hy = S0.y + 36, sy = Math.min(838, S0.y + 50);
  const inStart = (x, y, pad = 0) => y > S0.y - 34 - pad && x > Math.min(hx, sx) - 34 - pad && x < Math.max(hx, sx) + 34 + pad;
  const R = (a, b) => a + rng() * (b - a), RI = arr => arr[Math.floor(rng() * arr.length)];
  const nearCurve = (x, y, d) => C.sm.some((p, i) => i % 4 === 0 && Math.hypot(p[0] - x, p[1] - y) < d);
  const obsPts = OBS_F.map(f => C.at(f));
  const ri = th.obs.findIndex(o => o.river), fr = ri >= 0 ? OBS_F[ri] + .035 : 0;
  const rp = ri >= 0 ? C.at(fr) : {x: 0, y: -999}, ry = rp.y;
  const snow = th.tex === 'snow', props = [], add = (y, svg) => props.push({y, svg});
  const treeOf = (type, x, y, s) => type === 'round' ? roundTree(x, y, s, th.treeC, rng() < .35) : type === 'pine' ? pine(x, y, s, th.pineC, false)
    : type === 'snowpine' ? pine(x, y, s, th.pineC, true) : type === 'palm' ? palm(x, y, s, th.treeC) : type === 'lolli' ? lolli(x, y, s, RI(th.flowers)) : bushV(x, y, s, th, rng);
  const forestType = {wald:'pine', winter:'snowpine', insel:'palm', zucker:'lolli'}[th.key];
  const FL = FL_TYPES[th.key], fl = (x, y, s) => fancyFlower(RI(FL), x, y, s, RI(th.flowers));

  /* Himmel */
  let sky = '';
  if(th.sun) sky += circ(306, 52, 36, '#FFE98A', ' opacity=".35"') + Array.from({length: 12}, (_, k) => { const a = k * Math.PI / 6;
      return `<line x1="${n1(306 + Math.cos(a) * 25)}" y1="${n1(52 + Math.sin(a) * 25)}" x2="${n1(306 + Math.cos(a) * 31)}" y2="${n1(52 + Math.sin(a) * 31)}" stroke="#FFD43B" stroke-width="2.6" stroke-linecap="round"/>`; }).join('') +
    circ(306, 52, 20, '#FFD43B') + circ(300, 46, 7, '#fff', ' opacity=".35"');
  else if(th.key === 'winter') sky += circ(306, 54, 26, '#FFFBEA', ' opacity=".55"') + circ(306, 54, 16, '#FFF6D6') + Array.from({length: 26}, () => circ(R(4, 356), R(4, 200), R(.8, 1.8), '#fff', ' opacity=".9"')).join('');
  else sky += `<g opacity=".7">${['#FF8FB1', '#FFC93C', '#7FD7A8', '#7CC4FF', '#B794F6'].map((c, i) => `<path d="M${-26 + i * 6} 220 A${96 - i * 6} ${96 - i * 6} 0 0 1 ${166 - i * 6} 220" fill="none" stroke="${c}" stroke-width="6"/>`).join('')}</g>`;
  const cc = th.key === 'zucker' ? '#FFF7FC' : '#FFFFFF';
  sky += cloudV(54, 56, 1.15, cc) + cloudV(204, 30, .8, cc) + cloudV(330, 122, .7, cc);
  if(th.sun) sky += [[112, 84], [128, 76], [244, 98]].map(([x, y]) => `<path d="M${x} ${y} q4 -4 8 0 q4 -4 8 0" stroke="#4B5563" stroke-width="1.4" fill="none" stroke-linecap="round"/>`).join('');

  /* Berge */
  const far = [[-20, 222], [28, 146], [72, 196], [118, 132], [162, 192], [206, 154], [248, 200], [292, 126], [338, 182], [380, 152], [380, 240], [-20, 240]];
  const near = [[-20, 236], [22, 194], [66, 222], [106, 186], [152, 222], [198, 198], [242, 224], [288, 190], [332, 218], [380, 196], [380, 250], [-20, 250]];
  const caps = pts => { let r = ''; for(let i = 1; i < pts.length - 3; i++){ const [px, py] = pts[i], [ax, ay] = pts[i - 1], [bx, by] = pts[i + 1];
      if(py < ay && py < by){ const k = .3, l = [px + (ax - px) * k, py + (ay - py) * k], q = [px + (bx - px) * k, py + (by - py) * k];
        r += `<path d="M${n1(l[0])} ${n1(l[1])} L${px} ${py} L${n1(q[0])} ${n1(q[1])} L${n1(q[0] - (q[0] - px) * .35)} ${n1(q[1] - 4)} L${px + 2} ${n1(l[1] + 2)} L${n1(l[0] + (px - l[0]) * .4)} ${n1(l[1] - 4)}Z" fill="#fff" opacity=".95"/>`; } } return r; };
  const poly = (pts, c) => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${c}"/>`;
  const mtns = poly(far, th.mtn[0]) + (th.caps ? caps(far) : '') + poly(near, th.mtn[1]) + (th.key === 'zucker' ? caps(near) : '');
  const landD = 'M-10 234 Q 60 216 120 228 T 240 224 T 370 218 V850 H-10Z';

  th.obs.forEach((o, i) => {
    const p = obsPts[i];

    else if(o.scene === 'snow') groundScenes += snowScene(p);
    else if(o.scene === 'forest'){
      let cnt = 0;
      for(let k = 0; k < 16 && cnt < 8; k++){ const a = k / 16 * Math.PI * 2 + .3, rr = 40 + (k % 3) * 8, x = p.x + Math.cos(a) * rr, y = p.y + Math.sin(a) * rr * .8 + 6;
        if(x < 10 || x > 350 || nearCurve(x, y, 22)) continue; add(y, treeOf(forestType, x, y, R(.95, 1.25))); cnt++; }
    } else if(o.scene === 'flowers'){
      for(let k = 0; k < 18; k++){ const a = rng() * Math.PI * 2, rr = R(28, 50), x = p.x + Math.cos(a) * rr, y = p.y + Math.sin(a) * rr * .75 + 6;
        if(nearCurve(x, y, 14)) continue; add(y, fl(x, y, R(.8, 1))); }
    } else if(o.scene === 'cave'){
      const spot = [[44, -8], [-44, -8], [0, -46], [0, 46]].map(([a, b]) => ({x: p.x + a, y: p.y + b})).find(q => q.x > 34 && q.x < 326 && !nearCurve(q.x, q.y, 30)) || {x: p.x + 44, y: p.y - 8};
      add(spot.y, caveV(spot.x, spot.y));
    }
    if(o.extra) [[-46, -4], [46, 2]].forEach(([a, b]) => { const x = p.x + a, y = p.y + b; if(x > 12 && x < 348 && !nearCurve(x, y, 16)) add(y + 6, EMO(x, y, 17, o.extra)); });
  });

  /* Fluss (kommt vom Kartenrand, kreuzt den Weg genau einmal) */
  const rw = th.wideRiver ? 1.4 : 1;
  let river = '', riverSpan = null;
  if(ri >= 0){
    const clear = d => !C.sm.some(p => Math.abs(p[1] - ry) < 38 && (d > 0 ? p[0] > rp.x + 34 : p[0] < rp.x - 34));
    const dir = clear(1) ? 1 : clear(-1) ? -1 : 1, xe = dir > 0 ? 385 : -25, xEnd = rp.x - dir * 44, steps = 8;
    let d = `M${xe} ${n1(ry - 4)}`;
    for(let k = 1; k <= steps; k++){ const x = xe + (xEnd - xe) * k / steps, xm = xe + (xEnd - xe) * (k - .5) / steps;
      d += ` Q${n1(xm)} ${n1(ry + (k % 2 ? 9 : -9))} ${n1(x)} ${n1(ry + (k === steps ? 3 : 0))}`; }
    const px = xEnd - dir * 8;
    river = `<path d="${d}" fill="none" stroke="${th.bank}" stroke-width="${44 * rw}" stroke-linecap="round"/><ellipse cx="${n1(px)}" cy="${n1(ry + 3)}" rx="${n1(30 * rw)}" ry="${n1(19 * rw)}" fill="${th.bank}"/>
      <path d="${d}" fill="none" stroke="${th.river}" stroke-width="${31 * rw}" stroke-linecap="round"/><ellipse cx="${n1(px)}" cy="${n1(ry + 3)}" rx="${n1(24 * rw)}" ry="${n1(14 * rw)}" fill="${th.river}"/>
      <path d="${d}" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="${12 * rw}" transform="translate(0 -4)"/>
      <path class="flow" d="${d}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.4" stroke-dasharray="12 16" stroke-linecap="round"/>
      <path class="flow" d="${d}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6" stroke-dasharray="6 22" transform="translate(0 7)"/>
      <ellipse cx="${n1(px - dir * 6)}" cy="${n1(ry)}" rx="${n1(10 * rw)}" ry="${n1(4 * rw)}" fill="#fff" opacity=".25"/>`;
    riverSpan = [Math.min(xe, px - 36), Math.max(xe, px + 36)];
  }

  /* Blumenwiesen */
  let meadowGround = ''; const meadows = [];
  for(let k = 0; k < 600 && meadows.length < 3; k++){
    const x = R(50, 310), y = R(340, 780);
    if(nearCurve(x, y, 46) || obsPts.some(p => Math.hypot(p.x - x, p.y - y) < 80) || (lake && Math.hypot(lake.x - x, lake.y - y) < 80)) continue;
    if(riverSpan && x > riverSpan[0] - 20 && x < riverSpan[1] + 20 && Math.abs(y - ry) < 50) continue;
    if(meadows.some(m => Math.hypot(m.x - x, m.y - y) < 120) || inStart(x, y, 30)) continue;
    meadows.push({x, y});
    meadowGround += `<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="38" ry="15" fill="${th.patch[1]}" opacity=".8"/><ellipse cx="${n1(x - 6)}" cy="${n1(y - 2)}" rx="24" ry="7" fill="#fff" opacity=".18"/>`;
    for(let q = 0; q < 13; q++){ const a = rng() * Math.PI * 2, rr = Math.sqrt(rng()), fx = x + Math.cos(a) * 32 * rr, fy = y + Math.sin(a) * 11 * rr + 4;
      add(fy, fl(fx, fy, R(.75, 1.05))); }
    if(rng() < .7) add(y - 30, EMO(x + R(-14, 14), y - 26, 13, th.key === 'winter' ? '❄️' : RI(['🦋', '🐝', '🦋']), 'twk'));
  }
  /* Blumen am Wegesrand */
  for(let f = .02, k = 0; f < .965; f += .021, k++){
    const a = C.at(f - .003), b = C.at(f + .003), p = C.at(f), L = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y) / L, ny = (b.x - a.x) / L;
    const side = k % 2 ? 1 : -1, d = 16 + Math.max(0, ny * side) * 12 + rng() * 2, x = p.x + nx * d * side, y = p.y + ny * d * side;
    if(x < 8 || x > 352 || inStart(x, y)) continue;
    if(obsPts.some(q => Math.hypot(q.x - x, q.y - y) < 46)) continue;
    if(riverSpan && x > riverSpan[0] && x < riverSpan[1] && Math.abs(y - ry) < 30) continue;
    if(nearCurve(x, y, 14)) continue;
    add(y, fl(x, y, R(.6, .78)));
  }
  /* Schlossgarten */
  let gardenGround = '';
  [[88, 300, 72], [276, 304, 70]].forEach(([cx, cy, w]) => {
    const bed = flowerBed(cx, cy, w, th, rng, (x, y) => nearCurve(x, y, 16));
    gardenGround += bed.ground; bed.items.forEach(it => add(it.y, it.svg));
  });

  /* Deko */
  const used = []; let critters = 0;
  for(let k = 0; k < 1200 && used.length < 72; k++){
    const x = R(12, 348), y = R(246, 830);
    if(y < 310 && x > 34 && x < 326) continue;
    if(inStart(x, y, 6)) continue;
    if(riverSpan && x > riverSpan[0] && x < riverSpan[1] && Math.abs(y - ry) < 34) continue;
    if(lake && Math.hypot((lake.x - x) / 1.6, lake.y - y) < 34) continue;
    if(meadows.some(m => Math.hypot((m.x - x) / 2, m.y - y) < 20)) continue;
    if(y < 345 && ((x > 40 && x < 138) || (x > 228 && x < 324))) continue;  // Schlossgarten frei halten
    if(obsPts.some(p => Math.hypot(p.x - x, p.y - y) < 66)) continue;
    if(nearCurve(x, y, 26)) continue;
    if(used.some(([a, b]) => Math.hypot(a - x, b - y) < 21)) continue;
    used.push([x, y]);
    const t = rng();
    if(t < .5){
      const type = th.key === 'wald' ? (rng() < .68 ? 'round' : 'pine') : th.key === 'insel' ? (rng() < .7 ? 'palm' : 'bush') : th.tree;
      add(y, treeOf(type, x, y, R(.8, 1.15)));
    } else if(t < .76){ const n = 3 + Math.floor(rng() * 3), ty = RI(FL); for(let q = 0; q < n; q++){ const fx = x + R(-10, 10), fy = y + R(-5, 5); add(fy, fancyFlower(rng() < .7 ? ty : RI(FL), fx, fy, R(.75, 1), RI(th.flowers))); } }
    else if(t < .84) add(y, bushV(x, y, R(.8, 1.1), th, rng));
    else if(t < .91) add(y, rockV(x, y, R(.7, 1.1), th.rock));
    else if(critters < 9){ critters++; add(y, EMO(x, y - 8, Math.round(R(15, 19)), RI(th.critters))); }
  }
  props.sort((a, b) => a.y - b.y);

  /* Fluss + Brücke */
  /* Hindernisse */
  const obs = th.obs.map((o, i) => {
    const p = obsPts[i], w = o.n.length * 5.5 + 26, lx = Math.max(4 + w / 2, Math.min(356 - w / 2, p.x)), ty = p.y + 26;
    let bridge = '';
    if(o.river){
      const a = C.at(fr - .006), b = C.at(fr + .006), ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI, L = 36 * rw;
      let planks = ''; for(let x = -L + 6; x < L - 3; x += 6) planks += `<line x1="${n1(x)}" y1="-11" x2="${n1(x)}" y2="11" stroke="#000" stroke-opacity=".2" stroke-width="1"/>`;
      bridge = `<g class="aft" transform="translate(${n1(rp.x)} ${n1(rp.y)}) rotate(${n1(ang)})">
        <rect x="${-L}" y="-12" width="${2 * L}" height="24" rx="3" fill="${th.plank}"/>${planks}
        <rect x="${-L - 2}" y="-16" width="${2 * L + 4}" height="4" rx="2" fill="${th.plank}" stroke="#000" stroke-opacity=".3" stroke-width=".8"/>
        <rect x="${-L - 2}" y="12" width="${2 * L + 4}" height="4" rx="2" fill="${th.plank}" stroke="#000" stroke-opacity=".3" stroke-width=".8"/>
        ${[-L, 0, L].map(x => `<rect x="${n1(x - 2)}" y="-19" width="4" height="6" rx="1" fill="#6B4226"/><rect x="${n1(x - 2)}" y="13" width="4" height="6" rx="1" fill="#6B4226"/>`).join('')}</g>`;
    }
    return `<g class="ob" data-i="${i}">${bridge}${shadowE(p.x, p.y + 22, 16)}
      ${circ(p.x, p.y, 23, th.accent)}${circ(p.x, p.y, 23, 'url(#mgold)', ' class="ringd"')}${circ(p.x, p.y, 18.5, '#fff')}
      ${EMO(p.x, p.y + 1, 21, o.e, 'obe')}
      <path d="M${n1(lx - w / 2)} ${n1(ty)} H${n1(lx + w / 2)} L${n1(lx + w / 2 - 5)} ${n1(ty + 9)} L${n1(lx + w / 2)} ${n1(ty + 18)} H${n1(lx - w / 2)} L${n1(lx - w / 2 + 5)} ${n1(ty + 9)}Z" fill="${th.accent}"/>
      <text x="${n1(lx)}" y="${n1(ty + 9.4)}" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central">${o.n}</text>
      <g class="chk">${circ(p.x + 17, p.y - 17, 9, '#1FAF6A', ' stroke="#fff" stroke-width="2"')}<path d="M${n1(p.x + 12.5)} ${n1(p.y - 17)} l3 3 l5.5 -6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
  }).join('');

  /* Burgberg */
  const mound = `<ellipse cx="180" cy="270" rx="172" ry="42" fill="${th.hill}"/><ellipse cx="168" cy="260" rx="120" ry="22" fill="#fff" opacity=".18"/>`;
  const moundDeco = rockV(24, 290, 1.1, th.rock) + rockV(338, 282, .9, th.rock) + bushV(40, 284, 1, th, rng) + bushV(322, 292, 1, th, rng) +
'';

  const deco = arrived
    ? `${EMO(150, 226, 18, '💕', 'twk')}${EMO(212, 222, 18, '💕', 'twk')}${EMO(64, 120, 16, '✨', 'twk')}${EMO(298, 112, 16, '✨', 'twk')}${EMO(180, 12, 14, '✨', 'twk')}`
    : `<g class="wait"><rect x="210" y="252" width="100" height="26" rx="13" fill="#fff" stroke="${th.accent}" stroke-width="2"/><text x="260" y="265.5" font-size="11.5" font-weight="800" fill="#2B2140" text-anchor="middle" dominant-baseline="central">Ich warte! 💕</text></g>`;

  const tex = {
    grass: `<path d="M5 20 l1.5 -5 M8 20 v-6 M11 20 l-1.5 -5 M20 9 l1.2 -4 M22.5 9 v-5 M25 9 l-1.2 -4" stroke="${th.texc}" stroke-width="1.1" stroke-linecap="round" opacity=".5"/>`,
    snow: `<circle cx="5" cy="6" r="1.1" fill="${th.texc}" opacity=".4"/><circle cx="19" cy="17" r=".9" fill="${th.texc}" opacity=".4"/><circle cx="24" cy="5" r=".7" fill="#fff"/>`,
    sand: `<circle cx="5" cy="6" r=".9" fill="${th.texc}" opacity=".5"/><circle cx="18" cy="15" r=".8" fill="${th.texc}" opacity=".5"/><circle cx="25" cy="21" r=".7" fill="${th.texc}" opacity=".4"/>`,
    sprinkle: `<rect x="3" y="5" width="5" height="1.7" rx=".85" fill="#FF5FA2" transform="rotate(30 5.5 6)" opacity=".6"/><rect x="17" y="14" width="5" height="1.7" rx=".85" fill="#7BD3F7" transform="rotate(-40 19.5 15)" opacity=".6"/><rect x="22" y="3" width="5" height="1.7" rx=".85" fill="#FFD43B" transform="rotate(70 24.5 4)" opacity=".6"/>`
  }[th.tex];

  return `<svg id="jmap" viewBox="0 0 360 840" role="img" aria-label="Karte der Reise zum Schloss">
    <defs>
      <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${th.sky[0]}"/><stop offset="1" stop-color="${th.sky[1]}"/></linearGradient>
      <linearGradient id="mland" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${th.land[0]}"/><stop offset="1" stop-color="${th.land[1]}"/></linearGradient>
      <linearGradient id="mgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FEF3C7"/><stop offset=".5" stop-color="#FBBF24"/><stop offset="1" stop-color="#D97706"/></linearGradient>
      <linearGradient id="mhg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FEF08A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
      <pattern id="mtx" width="30" height="26" patternUnits="userSpaceOnUse">${tex}</pattern>
    </defs>
    <rect width="360" height="840" fill="url(#msky)"/>${sky}${mtns}
    <path d="${landD}" fill="url(#mland)"/><path d="${landD}" fill="url(#mtx)"/>
    ${patches}${groundScenes}${lakeSvg}${meadowGround}${mound}${gardenGround}
    <path d="${C.d}" fill="none" stroke="${th.trailEdge}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${C.d}" fill="none" stroke="${th.trail}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${C.d}" fill="none" stroke="${th.trailEdge}" stroke-opacity=".45" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>
    <path class="jp" d="${C.d}" pathLength="1000" fill="none" stroke="#FFE27A" stroke-opacity=".6" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 1001"/>
    <path class="jp" d="${C.d}" pathLength="1000" fill="none" stroke="#F5B30B" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 1001"/>
    ${river}${moundDeco}
    ${props.map(p => p.svg).join('')}
    ${obs}
    ${houseV(hx, hy)}${signV(sx, sy)}
    <g transform="translate(80 76)">${castleSVG(arrived, 'cm')}</g>
    ${EMO(180, 232, 22, H.p)}
    ${deco}
    <g id="jhero">${shadowE(0, 25, 17)}<g class="hbob">${circ(0, 0, 25, 'url(#mhg)')}${circ(0, 0, 20.5, '#fff')}${EMO(0, 1, 27, H.e)}${EMO(16, -18, 11, '✨', 'twk')}</g></g>
  </svg>`;
}

function viewReise(){
  const J = state.journey, th = jTheme(), H = heroInfo(), T = J.target, prog = jProg(), arrived = jArrived(), thr = jThr();
  const ni = thr.findIndex(t => prog < t);
  const next = arrived ? `🎉 ${H.Der} ist im Schloss angekommen!`
    : ni >= 0 ? `Nächstes Hindernis: ${th.obs[ni].e} <b>${th.obs[ni].n}</b> – noch ${thr[ni] - prog} ⭐`
    : `Gleich geschafft! Noch ${T - prog} ⭐ bis zum Schloss`;
  view.innerHTML = `<div class="card jhead"><div class="jt1">Reise ${J.n + 1} · ${th.name}</div><h2>${th.title}</h2>
      <div class="jsub">Bring ${H.akk} ${H.pDat} ins Märchenschloss! Jede richtige Antwort ist ein Schritt.</div>
      <div class="bar jbar"><i style="width:${prog / T * 100}%"></i></div>
      <div class="jnext">⭐ ${prog} / ${T} · ${next}</div></div>
    <div class="mapwrap">${mapSVG(th, H, arrived)}</div>
    ${J.trophies.length ? `<h2 class="sec">Geschaffte Reisen</h2><div class="card trow">${J.trophies.map(t => `<span>${t}</span>`).join('')}</div>` : ''}`;
  setupMap();
  if(!J.hero) setTimeout(heroPicker, 300);
}

function setupMap(){
  const tok = mapToken, J = state.journey, T = J.target, prog = jProg(), th = jTheme(), C = curve(th), thr = jThr();
  const svg = $('#jmap'); if(!svg) return;
  const hero = svg.querySelector('#jhero'), pp = [...svg.querySelectorAll('.jp')], obs = [...svg.querySelectorAll('.ob')];
  const place = v => { const f = v / T, p = C.at(f);
    hero.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
    pp.forEach(el => el.setAttribute('stroke-dasharray', `${(f * 1000).toFixed(1)} 1001`)); };
  const mark = v => obs.forEach((o, i) => { const done = v >= thr[i]; o.classList.toggle('done', done);
    o.querySelector('.obe').textContent = done ? (th.obs[i].after || th.obs[i].e) : th.obs[i].e; });
  const from = Math.min(J.seen, prog);
  place(from); mark(from);
  const r0 = hero.getBoundingClientRect();
  window.scrollTo(0, Math.max(0, window.scrollY + r0.top - window.innerHeight * .62));
  const finish = () => { J.seen = prog; save(); if(jArrived()) setTimeout(() => { if(tok === mapToken) celebrate(); }, 700); };
  if(prog <= from){ finish(); return; }
  setTimeout(() => {
    if(tok !== mapToken) return;
    const dur = Math.min(4500, 900 + (prog - from) * 70), t0 = performance.now(); let lastV = from, lastStep = 0;
    const frame = now => {
      if(tok !== mapToken || !document.body.contains(svg)) return;
      const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const v = from + (prog - from) * e;
      thr.forEach((x, i) => { if(lastV < x && v >= x){ sfx.ok(); toast(`${th.obs[i].after || th.obs[i].e} Geschafft! ${th.obs[i].ok}`); } });
      if(now - lastStep > 260){ sfx.step(); lastStep = now; }
      place(v); mark(v); lastV = v;
      const r = hero.getBoundingClientRect();
      if(r.top < window.innerHeight * .3) window.scrollTo(0, window.scrollY + r.top - window.innerHeight * .3);
      if(t < 1) requestAnimationFrame(frame); else finish();
    };
    requestAnimationFrame(frame);
  }, 650);
}

function celebrate(){
  if(document.querySelector('.mbg.celeb') || !jArrived()) return;
  const th = jTheme(), H = heroInfo();
  sfx.win(); confetti(90, ['🎆','🎇','✨','💖','👑','⭐','🎉']);
  setTimeout(() => confetti(60, ['💕','✨','🎆','🌟','👑']), 1500);
  const m = modal(`<svg class="celsvg" viewBox="-12 -78 224 284" aria-hidden="true">${castleSVG(true, 'cc')}
      <ellipse cx="100" cy="194" rx="114" ry="20" fill="#9BD98A"/>

      <text x="136" y="186" font-size="38" text-anchor="middle" dominant-baseline="central">${H.p}</text>
      <text class="twk" x="100" y="160" font-size="20" text-anchor="middle" dominant-baseline="central">💕</text></svg>
    <h2>Angekommen! 🎉</h2><p>${H.Der} ist endlich im Märchenschloss! ${H.pDie} hat schon gewartet. Jetzt wird ein großes Schlossfest gefeiert!</p>
    <div class="trophy">Neuer Reise-Pokal: <span>${th.trophy}</span></div>
    <div class="btnrow"><button class="btn" data-newj style="--ga:#8B5CF6">Neue Reise starten ➜</button></div>`);
  m.el.classList.add('celeb');
  m.el.querySelector('[data-newj]').onclick = () => {
    const J = state.journey; J.trophies.push(th.trophy); J.start += J.target; J.n++; J.seen = 0;

    save(); m.close(); sfx.sticker(); mapChooser();
  };
}

function mapChooser(){
  const J = state.journey, sugg = J.map;
  let sel = sugg;
  const m = modal(`<div class="mbig" style="font-size:56px">🗺️</div><h2>Wohin geht die nächste Reise?</h2>
    <p>Such dir eine Karte aus! Jede hat einen anderen Weg.</p>
    <div class="mapsel">${THEMES.map((th, i) => { const done = J.trophies.includes(th.trophy);
      return `<button data-mapi="${i}" class="${i === sel ? 'on' : ''}">${mapThumb(th, i)}<b>${th.name}</b><small>${done ? `${th.trophy} schon geschafft` : '✨ neu'}</small></button>`; }).join('')}</div>
    <div class="btnrow"><button class="btn" data-go style="--ga:#8B5CF6">Los geht's! ➜</button></div>`);

  const s = {alive:true, id, stars:0, playing:false,

    check(){ if(!s.alive) throw ABORT; }};

}
function exitGame(){

layer.addEventListener('click', async e => {

    const s = cur;

document.addEventListener('keydown', e => {
  if(!keyHandler || e.target.tagName === 'INPUT') return;
  if(/^[0-9]$/.test(e.key)) keyHandler(e.key);
  else if(e.key === 'Backspace') keyHandler('del');
  else if(e.key === 'Enter') { e.preventDefault(); keyHandler('ok'); }
});

function frame(g, s, dots = false){

function praise(txt){
  const p = layer.querySelector('.praise'); if(!p) return;
  p.textContent = txt || pick(PRAISE); p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
}
function bounce(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* Eingabe: Zahlenfeld oder Auswahl. Löst {ok, tries, first} auf. */
function answerFlow(mount, cfg){
  return new Promise(resolve => {
    let val = '', tries = 0, done = false, first = null;
    const slot = cfg.slot, choices = cfg.mode === 'choices';
    mount.innerHTML = `<div class="hint" hidden></div>` +
      (choices ? `<div class="choices">${cfg.choices.map(c => `<button data-v="${c}">${c}</button>`).join('')}</div>` : padHtml()) +
      `<div class="next" hidden><button class="btn big">Weiter ➜</button></div>`;
    const hintEl = mount.querySelector('.hint'), nextEl = mount.querySelector('.next'), inEl = mount.querySelector(choices ? '.choices' : '.pad');
    const show = () => { slot.textContent = val === '' ? '?' : val; slot.classList.toggle('filled', val !== ''); };
    show();
    function submit(){
      if(done) return;
      if(val === ''){ bounce(slot, 'nudge'); return; }
      const n = parseInt(val, 10);
      slot.classList.remove('bad', 'nudge');
      if(n === cfg.answer){
        done = true; keyHandler = null; slot.classList.add('ok'); sfx.ok(); praise();
        setTimeout(() => resolve({ok:true, tries:tries + 1, first}), 1000);
        return;
      }
      tries++; if(first === null) first = n; sfx.bad(); bounce(slot, 'bad');
      if(tries < 2){
        hintEl.innerHTML = `<span class="hi">💡</span><div>${cfg.hint}</div>`; hintEl.hidden = false;
        val = ''; setTimeout(() => { if(!done){ slot.classList.remove('bad'); show(); } }, 650);
      } else {
        done = true; keyHandler = null;
        hintEl.innerHTML = `<span class="hi">🦊</span><div>${cfg.explain}</div>`; hintEl.classList.add('sol'); hintEl.hidden = false;
        setTimeout(() => { slot.classList.remove('bad', 'filled'); slot.classList.add('reveal'); slot.textContent = cfg.answer; }, 500);
        inEl.hidden = true; nextEl.hidden = false;
        nextEl.querySelector('button').onclick = () => { sfx.tap(); resolve({ok:false, tries, first}); };
      }
    }
    const key = k => {
      if(done) return;
      if(k === 'del'){ val = val.slice(0, -1); sfx.tap(); show(); return; }
      if(k === 'ok'){ submit(); return; }
      if(val.length >= (cfg.maxLen || 3)) return;
      if(val === '0') val = '';
      val += k; sfx.tap(); show();
    };
    if(choices){
      inEl.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if(!b || done) return;
        val = b.dataset.v; show(); submit(); if(!done) b.disabled = true; });
      keyHandler = null;
    } else {
      inEl.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if(b) key(b.dataset.k); });
      keyHandler = key;
    }
  });
}
async function ask(s, mount, cfg){ const r = await answerFlow(mount, cfg); s.check(); return r; }
function waitTap(s, el){
  return new Promise(res => {
    const h = () => { el.removeEventListener('click', h); keyHandler = null; res(); };
    el.addEventListener('click', h);
    keyHandler = k => { if(k === 'ok') h(); };
  }).then(() => s.check());
}
